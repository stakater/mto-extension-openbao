# openbao-config-mto-bootstrap values.
#
# Cluster-level wiring for the OpenBao config / MTO integration. Installs
# the t-op-v2 parent + child Templates, RBAC, and the token-reviewer
# Secret. Renders once per cluster — the parent watches MTO Tenant CRs
# and fans out to one child TemplateInstance per Tenant.

# Namespace where the operator + bootstrap CRs (Templates, TI, RBAC,
# token-reviewer Secret) live. Must match the OpenBao config operator
# install namespace.
operatorNamespace: mto-extension-openbao-system

# t-op-v2 install identity. The ClusterRoles in this chart bind to the
# t-op-v2 controller's ServiceAccount; defaults match the upstream
# template-operator-v2 helm release. Override if your t-op-v2 release
# name or namespace differs.
templateOperator:
  serviceAccountName: template-operator-template-operator-v2
  namespace: stakater-template-operator

# The openbao-config-mto chart that t-op-v2 pulls from OCI per MTO Tenant
# CR at render time. Bump `version` to roll the per-tenant config shape
# without touching the operator or the bootstrap install.
openbaoConfigMto:
  registry: oci://ghcr.io/stakater/charts
  name: openbao-config-mto
  version: 0.4.0
  releaseName: openbao-config-mto

# Parent Template defaults — passed through to every child TI. Override
# per cluster to flip env labels, swap bao endpoints, or toggle SSO.
parent:
  env: dev
  baoServer: http://openbao.openbao.svc.cluster.local:8200
  kubernetesHost: https://kubernetes.default.svc
  tenantLabelKey: stakater.com/tenant
  sharedTenantName: shared
  eso: enabled
  externalSecretRefreshInterval: "1h"
  sso:
    enabled: false
    issuerUrl: ""
