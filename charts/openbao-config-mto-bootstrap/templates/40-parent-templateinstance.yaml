# Parent bootstrap TemplateInstance — the only TI in git. Pulls every
# Tenant CR cluster-wide and feeds the LIST to the parent gotemplate. The
# parent emits one child TI per tenant; those child TIs (and everything
# they render) are operator-managed via InstanceUIDLabel + finalizer
# cleanup, not in git.
---
apiVersion: templates.v2.stakater.com/v2alpha1
kind: TemplateInstance
metadata:
  name: openbao-config-mto-parent
  namespace: {{ .Values.operatorNamespace }}
spec:
  templateRef:
    name: openbao-config-mto-parent
    namespace: {{ .Values.operatorNamespace }}
  parameters:
    - name: tenants
      valueFrom:
        objectFieldRef:
          apiVersion: tenantoperator.stakater.com/v1beta3
          kind: Tenant
          jsonPath: .items
    {{- /* Cluster-wide namespace list. The parent gates each tenant on the
           count of namespaces carrying tenantLabelKey, which is the same fact
           the child TI's namespaceSelector resolves against — and the only one
           set by BOTH ways MTO attaches a namespace to a tenant (listed in the
           Tenant spec, or adopted by label). */}}
    - name: tenantNamespaces
      valueFrom:
        objectFieldRef:
          apiVersion: v1
          kind: Namespace
          jsonPath: .items
