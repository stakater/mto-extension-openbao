# Parent Template (gotemplate). Watches MTO Tenant CRs cluster-wide via
# the parent TI's objectFieldRef and renders:
#   - the shared bao-namespace scaffolding (singleton per bao backend)
#   - one TemplateInstance of the openbao-config-mto child Template per
#     Tenant CR
#
# Parameter defaults come from the bootstrap chart's values. The gotemplate
# body lives in files/parent-gotemplate.tpl (sourced via .Files.Get to keep
# the t-op-v2 action delimiters out of helm's template engine).
---
apiVersion: templates.v2.stakater.com/v2alpha1
kind: Template
metadata:
  name: openbao-config-mto-parent
  namespace: {{ .Values.operatorNamespace }}
spec:
  targetNamespaces:
    explicit:
      allow:
        literal:
          - {{ .Values.operatorNamespace }}
  {{- with include "openbao-config-mto-bootstrap.templateSync" . }}
  {{- . | nindent 2 }}
  {{- end }}
  parameters:
    - name: tenants
    {{- /* All namespaces, so the gotemplate can count the ones carrying
           tenantLabelKey. No `name`, so t-op-v2 LISTs the GVK; the read is
           already granted by the tenant-reader ClusterRole in 00-rbac.yaml. */}}
    - name: tenantNamespaces
    - name: env
      value: {{ .Values.parent.env | quote }}
    - name: operatorNamespace
      value: {{ .Values.operatorNamespace | quote }}
    - name: tokenReviewerSecretName
      value: bao-token-reviewer
    - name: kubernetesHost
      value: {{ .Values.parent.kubernetesHost | quote }}
    - name: childTemplateName
      value: openbao-config-mto
    - name: tenantLabelKey
      value: {{ .Values.parent.tenantLabelKey | quote }}
    - name: sharedTenantName
      value: {{ .Values.parent.sharedTenantName | quote }}
    {{- /* Toggles go through the validating helpers so a typo fails the render
           instead of silently disabling the integration. For accepted values
           the output is identical to quoting the raw value — see _helpers.tpl
           for why they are still routed this way. */}}
    - name: ssoEnabled
      value: {{ include "openbao-config-mto-bootstrap.ssoEnabled" . | quote }}
    - name: ssoIssuerUrl
      value: {{ (include "openbao-config-mto-bootstrap.parentSso" . | fromYaml).issuerUrl | default "" | quote }}
    - name: eso
      value: {{ include "openbao-config-mto-bootstrap.esoMode" . | quote }}
    - name: externalSecretRefreshInterval
      value: {{ .Values.parent.externalSecretRefreshInterval | quote }}
    - name: certManagerEnabled
      value: {{ include "openbao-config-mto-bootstrap.certManagerEnabled" . | quote }}
    - name: crossTenantPkiEnabled
      value: {{ include "openbao-config-mto-bootstrap.crossTenantPkiEnabled" . | quote }}
    - name: safetyDeletionProtection
      value: {{ include "openbao-config-mto-bootstrap.safetyDeletionProtection" . | quote }}
  # Health of the shared bao scaffolding this Template renders itself, plus every
  # child TI it emits. The shared objects are singletons behind every tenant —
  # if the kubernetes auth config is not Ready, no tenant's workload can log into
  # bao — and they appear on no child TI.
  #
  # Constraints that govern every entry here and in the child Template:
  #   - Each field's inner map holds 50 entries; beyond that entries are dropped
  #     and OutputsResolved reports it. `tenants` keys per child TI, so it covers
  #     50 children — 12 tenants at four slices each.
  #   - jsonPaths are condition filters, never plain field reads: a filter
  #     matching nothing resolves to "[]", while a scalar path matching nothing
  #     fails its whole field and holds OutputsResolved False.
  #   - Read the map with the OutputsResolved condition and outputsObservedAt: on
  #     size-cap overflow the previous values are retained, so a populated map
  #     can be stale, and a failed source watch never refreshes.
  outputs:
    - name: sharedNamespace
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoNamespace
        namespace: {{ .Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: sharedNsReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: sharedNsReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: sharedEngines
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoSecretEngine
        namespace: {{ .Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: sharedEngineReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: sharedEngineReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: sharedAuthMethod
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoAuthMethod
        namespace: {{ .Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: sharedAuthReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: sharedAuthReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: sharedAuthConfig
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoKubernetesAuthEngineConfig
        namespace: {{ .Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: sharedAuthConfigReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: sharedAuthConfigReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    # tiRendered / tiNsAllowed / tiParamsValid separate failure classes a bare
    # tiReady=False cannot: each needs a different fix.
    - name: tenants
      fromAll:
        apiVersion: templates.v2.stakater.com/v2alpha1
        kind: TemplateInstance
        namespace: {{ .Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: tiApplied,           jsonPath: "{.status.conditions[?(@.type=='Applied')].status}" }
        - { name: tiReady,             jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: tiSynced,            jsonPath: "{.status.conditions[?(@.type=='Synced')].status}" }
        - { name: tiRendered,          jsonPath: "{.status.conditions[?(@.type=='Rendered')].status}" }
        - { name: tiNsAllowed,         jsonPath: "{.status.conditions[?(@.type=='TargetNamespaceAllowed')].status}" }
        - { name: tiParamsValid,       jsonPath: "{.status.conditions[?(@.type=='ParametersValid')].status}" }
        # [*] keeps this a list query: matchedNamespaces is absent until a
        # namespaceSelector resolves. Same value once populated.
        - { name: tiMatchedNamespaces, jsonPath: "{.status.matchedNamespaces[*]}" }
  gotemplate: |
{{ .Files.Get "files/parent-gotemplate.tpl" | indent 4 }}
