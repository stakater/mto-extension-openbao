# Child Templates — one per chart component. The parent emits, per MTO Tenant
# CR, one TemplateInstance of the core Template plus one per enabled optional
# integration. Each TI pulls the same openbao-config-mto chart from OCI and
# renders one slice of it (values.component), so a missing optional CRD fails
# only that tenant's optional TI at server-side dry-run — the core bao wiring
# applies regardless.
#
# The Templates are rendered from one range so they share a parameter list and
# valuesTemplate and cannot drift; they differ only in the component literal
# and their status outputs.
#
# baoCABundle is NOT a pass-through parameter — it's a multi-line PEM that
# must be set as a chart-level value at chart-package or chart-pull time
# (or via a separate overlay). See the chart README → "Going to prod →
# bao HTTPS".
{{- /* Only enabled components get a Template. template-operator-v2 re-validates
       every Template on a timer by pulling the chart and dry-run rendering it,
       so an unused Template is a standing chart-pull cost for a slice no
       TemplateInstance references. The predicates below must match the parent
       gotemplate's TI-emission predicates exactly — toString comparisons, so a
       stringly "false" disables both sides together rather than rendering a
       Template with no TI (or worse, a TI with no Template). */ -}}
{{- $eso := include "openbao-config-mto-bootstrap.esoMode" . }}
{{- $certManager := include "openbao-config-mto-bootstrap.certManagerEnabled" . }}
{{- $crossTenantPki := include "openbao-config-mto-bootstrap.crossTenantPkiEnabled" . }}
{{- $slices := list (dict "component" "core" "nameSuffix" "") }}
{{- if eq $eso "enabled" }}
{{- $slices = append $slices (dict "component" "eso" "nameSuffix" "-eso") }}
{{- end }}
{{- if eq $certManager "true" }}
{{- $slices = append $slices (dict "component" "certManager" "nameSuffix" "-certmanager") }}
{{- end }}
{{- if eq $crossTenantPki "true" }}
{{- $slices = append $slices (dict "component" "trust" "nameSuffix" "-trust") }}
{{- end }}
{{- range $slice := $slices }}
---
apiVersion: templates.v2.stakater.com/v2alpha1
kind: Template
metadata:
  name: openbao-config-mto{{ $slice.nameSuffix }}
  namespace: {{ $.Values.operatorNamespace }}
spec:
  targetNamespaces:
    explicit:
      allow:
        literal:
          - {{ $.Values.operatorNamespace }}
  {{- /* $ , not . — the slice range above shadows the root context. */}}
  {{- with include "openbao-config-mto-bootstrap.templateSync" $ }}
  {{- . | nindent 2 }}
  {{- end }}
  parameters:
    - name: tenant
      required: true
    - name: env
      value: {{ $.Values.parent.env | quote }}
    - name: kubernetesHost
      value: {{ $.Values.parent.kubernetesHost | quote }}
    - name: baoServer
      value: {{ $.Values.parent.baoServer | quote }}
    - name: eso
      value: {{ $eso | quote }}
    - name: externalSecretRefreshInterval
      value: {{ $.Values.parent.externalSecretRefreshInterval | quote }}
    - name: ssoEnabled
      value: {{ include "openbao-config-mto-bootstrap.ssoEnabled" $ | quote }}
    - name: ssoIssuerUrl
      value: {{ (include "openbao-config-mto-bootstrap.parentSso" $ | fromYaml).issuerUrl | default "" | quote }}
    - name: sharedTenantName
      value: {{ $.Values.parent.sharedTenantName | quote }}
    - name: tenantLabelKey
      value: {{ $.Values.parent.tenantLabelKey | quote }}
    # Deletion-policy posture, normalized to "true"/"false" strings; the
    # valuesTemplate below re-materializes them as YAML booleans.
    - name: safetyDeletionProtection
      value: {{ include "openbao-config-mto-bootstrap.safetyDeletionProtection" $ | quote }}
    - name: safetyGrantDeletionProtection
      value: {{ include "openbao-config-mto-bootstrap.safetyGrantDeletionProtection" $ | quote }}
    # Roster of all real tenant names (CSV). Stamped per-child by the parent
    # gotemplate; the chart skips cross-tenant shares whose peer isn't listed.
    - name: knownTenants
      value: ""
    # Platform-PKI hierarchy coordinates. When platformPki.enabled, the tenant
    # chart renders its CA as a type=intermediate cross-ns-signed by this
    # platform CA; otherwise it keeps its self-signed root.
    - name: pkiHierarchyEnabled
      value: {{ include "openbao-config-mto-bootstrap.platformPkiEnabled" $ | quote }}
    - name: platformPkiMount
      value: {{ $.Values.platformPki.mountPath | quote }}
    - name: platformPkiNamespace
      value: {{ $.Values.platformPki.openbaoNamespace | quote }}
    - name: crossTenantPkiEnabled
      value: {{ $crossTenantPki | quote }}
    - name: certManagerEnabled
      value: {{ $certManager | quote }}
    - name: serviceAccounts
    - name: deployments
{{- if eq $slice.component "core" }}
  # Per-tenant health of everything the core slice renders, one entry per kind.
  # A TI reports that its objects were applied, not that the operator could then
  # act on them: a tenant whose every OpenBao CR sits Ready=False
  # reason=Forbidden still shows tiReady=True. The reason says who fixes it —
  # Invalid is the tenant's spec, Forbidden the operator's bao token, BaoError the
  # server, InternalError a controller bug.
  #
  # See the parent Template for the caps and the filter-path rule that govern
  # these entries. Two specifics here: a kind the tenant switches off matches
  # nothing and its fields stay absent (resolved, not failed), and policyReady /
  # k8sAuthRoleReady are the fields that scale with workload count, so they reach
  # the 50-entry cap first.
  outputs:
    - name: namespaces
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoNamespace
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: nsReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: nsReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: engines
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoSecretEngine
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: engineReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: engineReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: authMethods
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoAuthMethod
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: authMethodReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: authMethodReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: k8sAuthConfigs
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoKubernetesAuthEngineConfig
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: k8sAuthConfigReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: k8sAuthConfigReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: k8sAuthRoles
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoKubernetesAuthRole
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: k8sAuthRoleReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: k8sAuthRoleReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: policies
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoPolicy
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: policyReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: policyReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: transitKeys
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoTransitKey
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: transitKeyReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: transitKeyReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: oidcConfigs
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoJWTOIDCAuthEngineConfig
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: oidcConfigReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: oidcConfigReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: oidcRoles
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoJWTOIDCAuthEngineRole
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: oidcRoleReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: oidcRoleReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: pkiRoles
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoPKISecretEngineRole
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: pkiRoleReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: pkiRoleReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    # caSerial flips only when someone replaces the tenant CA out of band — no
    # SSO tier can, so an unexpected change is a red flag. Absent until the
    # tenant has its first labelled namespace, since the CA waits for one. Read
    # through fromAll, not from: `from` fails terminally when the named object is
    # absent, which is every install with pki.enabled=false and every tenant in
    # that window.
    - name: pkiConfigs
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoPKISecretEngineConfig
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: pkiConfigReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: pkiConfigReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
        - { name: caSerial,        jsonPath: "{.status.caSerialNumber}" }
{{- else if eq $slice.component "eso" }}
  # Per-tenant health of the eso slice. Reading the SecretStore as well as the
  # ExternalSecrets distinguishes "this one workload" from "this tenant's bao
  # auth" — a broken store fails every ExternalSecret pointing at it. Keyed
  # namespace/name because these land in the workload namespaces, so the
  # namespace identifies the workload. One entry per ExternalSecret, against the
  # 50-entry cap.
  outputs:
    - name: externalSecretSync
      fromAll:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
      keyTemplate: "{.metadata.namespace}/{.metadata.name}"
      fields:
        - { name: esReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: esReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
        # Not status.refreshTime: that is a scalar, so one never-synced
        # ExternalSecret would hold OutputsResolved False for the whole tenant.
        - { name: esSince,  jsonPath: "{.status.conditions[?(@.type=='Ready')].lastTransitionTime}" }
    - name: secretStores
      fromAll:
        apiVersion: external-secrets.io/v1
        kind: SecretStore
      keyTemplate: "{.metadata.namespace}/{.metadata.name}"
      fields:
        - { name: storeReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: storeReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
{{- else if eq $slice.component "certManager" }}
  # Per-tenant health of the certManager slice. The Issuer goes Ready=False on its
  # own when bao rejects the login, independently of whether this TI applied. The
  # ServiceAccount, Role and RoleBinding this slice renders have no status to read.
  outputs:
    - name: issuers
      fromAll:
        apiVersion: cert-manager.io/v1
        kind: Issuer
      keyTemplate: "{.metadata.namespace}/{.metadata.name}"
      fields:
        - { name: issuerReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: issuerReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: policies
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoPolicy
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: policyReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: policyReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
    - name: k8sAuthRoles
      fromAll:
        apiVersion: security.mto.stakater.com/v1alpha1
        kind: OpenBaoKubernetesAuthRole
        namespace: {{ $.Values.operatorNamespace }}
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: k8sAuthRoleReady,  jsonPath: "{.status.conditions[?(@.type=='Ready')].status}" }
        - { name: k8sAuthRoleReason, jsonPath: "{.status.conditions[?(@.type=='Ready')].reason}" }
{{- else if eq $slice.component "trust" }}
  # Per-tenant health of the trust slice. trust-manager reports Synced, not Ready
  # — a filter on Ready would resolve to "[]" forever and read as "nothing to
  # report" rather than as a failure. Bundles are cluster-scoped, so no namespace
  # scopes the iteration. The slice's other object is a ConfigMap: no status.
  outputs:
    - name: bundles
      fromAll:
        apiVersion: trust.cert-manager.io/v1alpha1
        kind: Bundle
      keyTemplate: "{.metadata.name}"
      fields:
        - { name: bundleSynced, jsonPath: "{.status.conditions[?(@.type=='Synced')].status}" }
        - { name: bundleReason, jsonPath: "{.status.conditions[?(@.type=='Synced')].reason}" }
{{- end }}
  helm:
    chart:
      repository:
        url: {{ $.Values.openbaoConfigMto.registry | quote }}
        name: {{ $.Values.openbaoConfigMto.name | quote }}
        version: {{ $.Values.openbaoConfigMto.version | quote }}
        {{- if $.Values.openbaoConfigMto.authSecretName }}
        auth:
          secretRef:
            name: {{ $.Values.openbaoConfigMto.authSecretName | quote }}
        {{- end }}
    releaseName: {{ $.Values.openbaoConfigMto.releaseName | quote }}
    version: v4
    valuesTemplate: |
      component: {{ $slice.component }}
      tenant: {{ `{{ .parameters.tenant }}` }}
      env: {{ `{{ .parameters.env }}` }}
      baoServer: {{ `{{ .parameters.baoServer }}` }}
      kubernetesHost: {{ `{{ .parameters.kubernetesHost }}` }}
      eso: {{ `{{ .parameters.eso }}` }}
      externalSecretRefreshInterval: {{ `{{ .parameters.externalSecretRefreshInterval }}` }}
      {{- /* Install-wide, so rendered literally rather than threaded through a
             parameter. Built key-by-key and emitted only when at least one is
             set: an empty `token:` key would reach the tenant chart as a null
             map and wipe its own ttl/maxTTL defaults for every tenant. period
             is not plumbed on purpose — see values.yaml. */ -}}
      {{- $ptok := dict }}
      {{- $src := (($.Values.parent | default dict).token | default dict) }}
      {{- range $k := (list "type" "ttl" "maxTTL") }}
      {{- $v := get $src $k }}
      {{- if $v }}{{- $_ := set $ptok $k ($v | toString) }}{{- end }}
      {{- end }}
      {{- with $ptok }}
      token:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      operatorNamespace: {{ $.Values.operatorNamespace }}
      tokenReviewerSecretName: bao-token-reviewer
      tenantLabelKey: {{ `{{ .parameters.tenantLabelKey }}` }}
      safety:
        deletionProtection: {{ `{{ .parameters.safetyDeletionProtection }}` }}
        grantDeletionProtection: {{ `{{ .parameters.safetyGrantDeletionProtection }}` }}
      knownTenants: {{ `{{ .parameters.knownTenants | quote }}` }}
      pki:
        hierarchy:
          enabled: {{ `{{ .parameters.pkiHierarchyEnabled }}` }}
          platformMount: {{ `{{ .parameters.platformPkiMount }}` }}
          platformNamespace: {{ `{{ .parameters.platformPkiNamespace }}` }}
        crossTenant:
          enabled: {{ `{{ .parameters.crossTenantPkiEnabled }}` }}
        certManager:
          enabled: {{ `{{ .parameters.certManagerEnabled }}` }}
        {{- /* Install-wide, so rendered literally rather than threaded through a
               parameter. Omitted when unset so the tenant chart's own default
               applies. t-op-v2 owns rendered fields via SSA, so anything not
               plumbed here is unreachable for every tenant. */ -}}
        {{- with (($.Values.parent | default dict).pki | default dict).roles }}
        roles:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      sharedTenant:
        name: {{ `{{ .parameters.sharedTenantName }}` }}
      sso:
        enabled: {{ `{{ .parameters.ssoEnabled }}` }}
        dex:
          issuerUrl: {{ `{{ .parameters.ssoIssuerUrl | quote }}` }}
        {{- with (include "openbao-config-mto-bootstrap.parentSso" $ | fromYaml).allowedRedirectUris }}
        allowedRedirectUris:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      serviceAccounts: {{ `{{ .parameters.serviceAccounts | toJson }}` }}
      deployments: {{ `{{ .parameters.deployments | toJson }}` }}
{{- end }}
