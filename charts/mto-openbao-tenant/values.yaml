# mto-openbao chart values.
#
# Most values fall through from sensible defaults; the parent gotemplate
# Template stamps the per-child values (tenant, serviceAccounts, deployments).
# The remaining knobs cluster around five concerns:
#   - identity:        tenant, tenantLabelKey, sharedTenant.*
#   - addressing:      baoServer, baoCABundle, kubernetesHost, operatorNamespace
#   - engines:         kv tier caps, transit.*, pki.*
#   - workload tokens: token.*, defaultCapability
#   - human SSO:       sso.* (incl. ssoToken.* for tighter human-session TTLs)
#
# Production deployment guidance lives in README.md → "Going to prod".

# Environment slice for KV paths (kv/data/<env>/...).
env: dev

# Bao server URL used in ESO SecretStores + ConfigMap VAULT_ADDR.
# PRODUCTION: switch to https://. If bao serves with a private-PKI cert,
# also set baoCABundle (PEM, multi-line) and wire the workload-side mount.
baoServer: http://openbao.openbao.svc.cluster.local:8200

# Optional PEM CA bundle for the bao server cert. When set, the chart emits
# a Secret in every workload namespace named bao-ca-bundle and adds
# VAULT_CACERT to the per-SA ConfigMap pointing at the mount path. Empty
# means trust system roots.
baoCABundle: ""

# K8s apiserver URL used in OpenBaoKubernetesAuthEngineConfig.kubernetesHost.
kubernetesHost: https://kubernetes.default.svc

# ESO toggle: "enabled" or "disabled". When disabled, SecretStore +
# ExternalSecret CRs are not emitted; workloads talk to bao directly.
eso: enabled

# ExternalSecret refreshInterval. PRODUCTION default is 1h: bao auth/login
# is not free and a hot loop at 30s × N workloads will saturate bao before
# the chart does.
externalSecretRefreshInterval: "1h"

# Operator namespace where the bao-scoped CRs live. Must match the operator
# install. Used as `metadata.namespace` for every OpenBao* CR.
operatorNamespace: mto-extension-openbao-system

# Token-reviewer Secret name (used by every per-tenant
# OpenBaoKubernetesAuthEngineConfig).
tokenReviewerSecretName: bao-token-reviewer

# Cluster-wide ns label key MTO applies to tenant namespaces. The parent
# uses this key in its namespaceSelector to scope SA/Deployment watches
# per child TI. Default: stakater.com/tenant. Override only if your MTO
# install uses a different convention.
tenantLabelKey: stakater.com/tenant

# Shared bao namespace — where cross-tenant share paths land. Parent emits
# the scaffolding for this ns once per cluster (singleton). Rename if you
# run two operator installs against the same bao backend; the default is
# fine for the common case.
sharedTenant:
  name: shared

# ─── Tier capabilities (KV) ──────────────────────────────────────────
# audit-read   list-only on metadata, no data reads — for compliance probes
# viewer       read + list on KV
# editor       create/read/update/list
# admin        editor + delete (data) + later destroy (versions)
# super-admin  reserved for tier-aware sso policies — workload SAs never
#              receive super-admin; see sso.tiers
tierCaps:
  audit-read: '["list"]'
  viewer:     '["read", "list"]'
  editor:     '["create", "read", "update", "list"]'
  admin:      '["create", "read", "update", "delete", "list"]'

# Tier to apply when a workload's ServiceAccount has no
# `bao.stakater.com/tier` annotation.
#   viewer | editor | admin | audit-read — SA gets that tier's policy.
#   none — SA is skipped (no role rendered); workloads must opt in.
defaultCapability: none

# Workload token defaults stamped onto every OpenBaoKubernetesAuthRole.
token:
  ttl: "1h"
  maxTTL: "4h"
  period: ""

# SSO token TTLs — usually shorter than workload tokens because group
# membership in the IdP isn't enforced live on already-issued bao tokens.
# Default 15m / 1h gives operators ~15 minutes of stale-group-grant
# exposure after a user is removed from an IdP group. Tune lower for
# higher-privilege admin tiers if your IdP can't push token revocation.
ssoToken:
  ttl: "15m"
  maxTTL: "1h"

# Tenant identity for this chart instance. Required at render time.
tenant: ""

# Lists resolved by the child TI's namespaceSelector. Empty by default.
serviceAccounts: []
deployments: []

# ─── Transit ─────────────────────────────────────────────────────────
transit:
  enabled: true
  mountPath: transit
  # Default auto-rotation period applied to keys that don't set their own
  # autoRotatePeriod. "0" / empty disables. Compliance regimes (PCI, HIPAA)
  # generally require keys to rotate at least annually; default = 90 days.
  defaultAutoRotatePeriod: "2160h"
  # Tenant-wide keys emitted by this chart. SAs opt into encrypt/decrypt
  # via `bao.stakater.com/transit-keys: <csv>` — values reference key
  # names declared here (annotation typos surface as render errors when
  # transit.strictAnnotationValidation=true; default true).
  strictAnnotationValidation: true
  keys:
    - name: app-data
    - name: pii
    - name: tokens
      autoRotatePeriod: "720h"   # monthly — overrides defaultAutoRotatePeriod
  tierCaps:
    audit-read: '[]'             # transit isn't meaningful read-only
    viewer:     '[]'             # transit needs writes; viewer = no transit
    editor:     '["update"]'     # encrypt/decrypt/rewrap
    admin:      '["create", "read", "update", "list", "delete"]'

# ─── PKI ─────────────────────────────────────────────────────────────
pki:
  enabled: true
  mountPath: pki
  # Annotation validation — same shape as transit.strictAnnotationValidation.
  strictAnnotationValidation: true
  # Root CA config. PRODUCTION: prefer pkiType=intermediate signed by an
  # external root you control out-of-band (currently the operator's
  # OpenBaoPKISecretEngineConfig only supports pkiType=root — track
  # operator support for intermediate before going to prod).
  rootCA:
    commonName: "{tenant} Internal CA"
    # 10y RSA-3072 default — NIST recommends ≥3072 for roots living past
    # 2030. EC P-256 is a faster modern alternative; switch keyType=ec
    # keyBits=256 if your downstream cert consumers support it.
    ttl: "87600h"
    keyType: rsa
    keyBits: 3072
  # Role catalog emitted once per tenant. SAs opt in via
  # `bao.stakater.com/pki-roles: <csv>`. allowedDomains supports
  # `{tenant}` substitution.
  roles:
    - name: internal-https
      allowedDomains:
        - "{tenant}.svc.cluster.local"
        - "*.{tenant}.svc.cluster.local"
      allowSubdomains: true
      enforceHostnames: true
      maxTtl: "720h"
      ttl: "168h"
      serverFlag: true     # FIX: serverFlag must be true on an https role
      clientFlag: false
    - name: workload-mtls
      allowedDomains:
        - "{tenant}.svc.cluster.local"
        - "*.{tenant}.svc.cluster.local"
      allowSubdomains: true
      maxTtl: "168h"
      ttl: "24h"
      serverFlag: true
      clientFlag: true

# ─── Human SSO ───────────────────────────────────────────────────────
sso:
  enabled: false

  dex:
    issuerUrl: ""
    clientId: openbao
    clientSecretRef:
      name: bao-oidc-client-secret
      key: client-secret
    caBundlePem: ""
    # When true, each tenant gets its own per-tenant dex Client (id
    # interpolated via `{tenant}-` prefix) rather than the shared `openbao`
    # client. Per-tenant clients isolate client_secret blast radius but
    # require IdP-side provisioning per tenant. Default false (shared).
    perTenantClient: false

  # Default IdP-group pattern when no per-tier override is set.
  # Placeholders: {tenant} (tenant name), {tier} (super-admin|admin|editor|
  # viewer|audit-read). Use a literal (no placeholder) to bind every
  # tenant's tier to the same IdP group — useful for cluster-wide admin.
  tenantGroupTemplate: "{tenant}-{tier}s"

  # Per-tier role mapping. Empty entry → use tenantGroupTemplate. Override
  # a single tier's group pattern (e.g. all-tenant cluster-admins). Mirrors
  # the mto-extension-grafana shape (TenantRoleMapping.{Admin,Owner,...}.Pattern).
  #
  # Fallback role: when set to a tier name (admin | editor | viewer |
  # audit-read), the chart emits an additional OIDC role
  # `sso-<tenant>-fallback` with NO group binding and the fallback tier's
  # policies attached. Any user with a valid OIDC token can log into the
  # tenant via that role and inherit the fallback tier. Default `deny`
  # means no fallback role is emitted (the user must match a group).
  tenantRoleMapping:
    super-admin: {}                # uses tenantGroupTemplate
    admin:       {}                # uses tenantGroupTemplate
    editor:      {}
    viewer:      {}
    audit-read:  {}
    fallback: deny                 # deny | viewer | editor | admin | audit-read

  audience: openbao
  allowedRedirectUris:
    - "http://localhost:8250/oidc/callback"

  # Tiers to emit SSO roles for. Note: `super-admin` is reserved for the
  # destructive CA-management path; v9 emits the role iff this includes
  # it. Tenant admins get admin (KV+transit+PKI ops) without root/config
  # destruction; only super-admin can re-generate the tenant root CA.
  tiers:
    - super-admin
    - admin
    - editor
    - viewer
    - audit-read

# ─── NetworkPolicy (workload ns) ─────────────────────────────────────
# When enabled, the chart emits a default-deny + bao-egress NetworkPolicy
# in every workload namespace. Requires the cluster CNI to honor
# NetworkPolicies (Calico, Cilium, OpenShift OVN-Kubernetes do; default
# kindnet does not).
networkPolicy:
  enabled: false
  # Egress destination for bao. Match baoServer host. Workloads can also
  # reach the cluster apiserver (for the SA token round-trip).
  baoSelector:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openbao

# ─── Monitoring (ServiceMonitor + PrometheusRule) ────────────────────
# Off by default — requires prometheus-operator CRDs. When enabled, ships
# alerts on rendered-CR Ready=False and ExternalSecret SecretSyncedError.
monitoring:
  enabled: false
  # Namespace where the prometheus-operator selects ServiceMonitors. Often
  # "monitoring" or "openshift-monitoring".
  prometheusNamespace: monitoring
