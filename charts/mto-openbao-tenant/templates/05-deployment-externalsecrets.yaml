{{/*
Section 4 — per annotated Deployment, render one ExternalSecret per
`bao.stakater.com/{secret,subscribe,import}.<name>` annotation.

Annotation forms:
  secret.<name>:    <leaf>[#<key>]                 own-ns      → kv/data/<env>/<dNs>/<leaf>            store: <sa>-bao
  subscribe.<name>: <writer-saNs>/<leaf>[#<key>]   intra-tenant → kv/data/<env>/_shared/from-<writer>/<leaf>  store: <sa>-bao
  import.<name>:    <peer-tenant>/<leaf>[#<key>]   cross-tenant → kv/data/<env>/from-<peer>/to-<own-tenant>/<leaf>  store: <sa>-share-<peer>-bao

Skipped entirely when eso=disabled.
*/}}
{{- if eq .Values.eso "enabled" }}
{{- $dTenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $refresh := .Values.externalSecretRefreshInterval }}
{{- $labels := include "openbao.labels" . }}
{{- range $d := .Values.deployments }}
{{- $dNs := dig "metadata" "namespace" "" $d }}
{{- $dSa := dig "spec" "template" "spec" "serviceAccountName" "" $d }}
{{- $annotations := dig "metadata" "annotations" (dict) $d }}
{{- if and $dNs $dSa $annotations }}
{{- range $key, $rawVal := $annotations }}
{{- $isSecret := hasPrefix "bao.stakater.com/secret." $key }}
{{- $isShared := hasPrefix "bao.stakater.com/subscribe." $key }}
{{- $isImport := hasPrefix "bao.stakater.com/import." $key }}
{{- if or $isSecret $isShared $isImport }}
{{- $secretName := "" }}
{{- if $isSecret }}{{ $secretName = trimPrefix "bao.stakater.com/secret." $key }}{{ end }}
{{- if $isShared }}{{ $secretName = trimPrefix "bao.stakater.com/subscribe." $key }}{{ end }}
{{- if $isImport }}{{ $secretName = trimPrefix "bao.stakater.com/import." $key }}{{ end }}
{{- $sliceParts := splitList "#" $rawVal }}
{{- $valBody := index $sliceParts 0 }}
{{- $sliceKey := "" }}
{{- if gt (len $sliceParts) 1 }}{{ $sliceKey = index $sliceParts 1 }}{{ end }}
{{- $baoPath := "" }}
{{- $storeName := "" }}
{{- $skip := false }}
{{- if $isSecret }}
{{- $baoPath = printf "%s/%s/%s" $env $dNs $valBody }}
{{- $storeName = printf "%s-bao" $dSa }}
{{- else if $isShared }}
{{- $refParts := splitList "/" $valBody }}
{{- if ge (len $refParts) 2 }}
{{- $writerNs := first $refParts }}
{{- $leaf := join "/" (rest $refParts) }}
{{- $baoPath = printf "%s/_shared/from-%s/%s" $env $writerNs $leaf }}
{{- $storeName = printf "%s-bao" $dSa }}
{{- else }}{{ $skip = true }}{{ end }}
{{- else if $isImport }}
{{- $refParts := splitList "/" $valBody }}
{{- if ge (len $refParts) 2 }}
{{- $peer := first $refParts }}
{{- $leaf := join "/" (rest $refParts) }}
{{- $baoPath = printf "%s/from-%s/to-%s/%s" $env $peer $dTenant $leaf }}
{{- $storeName = printf "%s-share-%s-bao" $dSa $peer }}
{{- else }}{{ $skip = true }}{{ end }}
{{- end }}
{{- if not $skip }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $dNs }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  refreshInterval: {{ $refresh }}
  secretStoreRef:
    name: {{ $storeName }}
    kind: SecretStore
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  {{- if $sliceKey }}
  data:
    - secretKey: {{ $sliceKey }}
      remoteRef:
        key: {{ $baoPath }}
        property: {{ $sliceKey }}
  {{- else }}
  dataFrom:
    - extract:
        key: {{ $baoPath }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
