# mto-extension-openbao-bootstrap values.
#
# Cluster-level wiring for the OpenBao config / MTO integration. Installs
# the t-op-v2 parent + child Templates, RBAC, and the token-reviewer
# Secret. Renders once per cluster — the parent watches MTO Tenant CRs
# and fans out to one child TemplateInstance per Tenant.

# Namespace where the operator + bootstrap CRs (Templates, TI, RBAC,
# token-reviewer Secret) live. Must match the OpenBao config operator
# install namespace.
operatorNamespace: openbao-config-operator-system

# Deletion-policy posture for everything this integration renders — the
# platform-PKI CRs here AND (via the child Templates) every per-tenant CR.
safety:
  # true (default): mounts, auth mounts and bao namespaces get
  # deletionPolicy=Retain — CR deletion/rename orphans the bao object and
  # its data (logged + Event). false: CR deletion destroys it; a namespace
  # delete cascades through everything inside.
  deletionProtection: true
  # false (default): grants get deletionPolicy=Delete — deleting the CR
  # revokes the access. true: grants survive CR deletion and render churn,
  # at the cost of leaked grants on offboarding that nothing tracks.
  grantDeletionProtection: false

# t-op-v2 install identity. The ClusterRoles in this chart bind to the
# t-op-v2 controller's ServiceAccount; defaults match the upstream
# template-operator-v2 helm release. Override if your t-op-v2 release
# name or namespace differs.
templateOperator:
  serviceAccountName: template-operator-template-operator-v2
  namespace: stakater-template-operator

# The mto-extension-openbao chart that t-op-v2 pulls from OCI per MTO Tenant
# CR at render time. Bump `version` to roll the per-tenant config shape
# without touching the operator or the bootstrap install.
openbaoConfigMto:
  registry: oci://ghcr.io/stakater/charts
  name: mto-extension-openbao
  version: 0.22.0
  releaseName: openbao-config-mto
  # Optional: name of a Secret (in the operator ns) holding OCI registry
  # credentials. Required when pulling the chart from a private registry.
  # Supported Secret shapes (per t-op-v2): {username,password} | {token} |
  # {.dockerconfigjson}. Empty = anonymous pull.
  authSecretName: ""

# Platform PKI — an optional cluster-wide CA that signs every tenant's
# intermediate CA, giving a root → platform CA → per-tenant intermediate →
# leaf hierarchy with one common trust anchor. Rendered once per cluster.
#
# Enabled by default: tenants get a common trust anchor out of the box. With
# this on, tenant charts render their CA as a type=intermediate cross-namespace-
# signed by this platform CA (the bootstrap passes the platform mount + namespace
# down to each tenant). Set enabled=false to fall back to per-tenant self-signed
# roots (no common anchor).
#
# UPGRADE NOTE: turning this on for an EXISTING cluster is a trust-chain cutover
# — tenants move from a self-signed root to an intermediate at a fresh mount, so
# already-issued leaves must be re-issued (cert-manager re-issues on CA change).
# Fresh installs have no cutover. Default mode=root needs no offline ceremony.
#
# Operator bao-token policy (the crux operational prerequisite): the single
# operator token must be granted, in the platform namespace (openbaoNamespace
# below), `update` on `<mountPath>/root/sign-intermediate`. It already has
# `intermediate/{generate/internal,set-signed}` + `cert/ca` in each tenant
# namespace (existing per-tenant grant). A dev root token covers all of this.
platformPki:
  enabled: true
  # OpenBao namespace the platform CA lives in. A dedicated child keeps it
  # isolated from tenants; "" puts it in the root namespace.
  openbaoNamespace: platform/
  mountPath: pki-platform
  # root         = online self-signed platform root (default; no ceremony).
  # intermediate = platform CA is itself an intermediate signed by an
  #   offline root; the operator exports a CSR and waits for the signed
  #   cert in externalSignSecret (production-grade — root stays offline).
  mode: root
  commonName: "Platform CA"
  ttl: "175200h"   # 20y
  # Name constraints applied to the platform CA (bounds every tenant
  # intermediate it signs). Empty = unconstrained at the platform tier.
  permittedDnsDomains:
    - "svc.cluster.local"
  # Required when mode=intermediate: the Secret (in operatorNamespace) the
  # offline signer writes the signed platform cert into (key tls.crt).
  externalSignSecret: ""

# Cross-tenant PKI trust (opt-in, least-privilege, fails-closed). When enabled,
# each tenant publishes its CA to a `<tenant>-ca` ConfigMap and gets a
# trust-manager Bundle sourcing only the peers its SAs opted into (via
# bao.stakater.com/pki-allow-tenant / pki-trust-tenant annotations). Default
# off — it needs cert-manager trust-manager installed with its trust namespace
# = operatorNamespace. See the tenant chart's pki.crossTenant.
#
# The Bundle renders in its own per-tenant TemplateInstance
# (`openbao-config-mto-<tenant>.trust`), separate from parent.certManager's —
# trust-manager and cert-manager are distinct operators with distinct CRDs.
crossTenantPki:
  enabled: false

# Parent Template defaults — passed through to every child TI. Override
# per cluster to flip env labels, swap bao endpoints, or toggle SSO.
parent:
  env: dev
  baoServer: http://openbao.openbao.svc.cluster.local:8200
  kubernetesHost: https://kubernetes.default.svc
  tenantLabelKey: stakater.com/tenant
  sharedTenantName: shared
  eso: enabled
  externalSecretRefreshInterval: "1h"
  # Workload token settings (tenant chart value `token`). Install-wide: every
  # tenant gets the same. Empty here means the tenant chart's own defaults
  # apply — t-op-v2 owns rendered CR fields via SSA, so anything not plumbed
  # here is unreachable for every tenant, which is why these are exposed at all.
  #
  # `type` is the lever paired with externalSecretRefreshInterval above. ESO
  # re-authenticates on every refresh, and on raft storage a `service` login
  # costs 4 fsync'd writes and ~72ms of bao time against ~0.3ms and zero writes
  # for `batch`. Lowering the refresh interval without setting batch multiplies
  # that cost by the number of workloads.
  #
  # batch tokens cannot be renewed or revoked (no accessor), so `ttl` becomes
  # the only way to retire a leaked one — shorten it when setting batch. See
  # the tenant chart's values.yaml for the full trade-off.
  #
  # token.period is deliberately NOT exposed: bao silently ignores it on a
  # batch token, and the tenant chart fails the render on that combination.
  token: {}
  #  type: batch
  #  ttl: "15m"
  #  maxTTL: "1h"
  # cert-manager Issuer wiring (chart value pki.certManager.enabled). When
  # true, each tenant with a PKI-opted-in ServiceAccount gets an
  # `openbao-config-mto-<tenant>.certmanager` TemplateInstance rendering the
  # per-namespace Issuer + auth wiring. Requires the cert-manager CRDs —
  # without them only that TI fails; core bao wiring is unaffected.
  certManager:
    enabled: false
  # Tenant PKI role catalog (tenant chart value pki.roles). Install-wide: every
  # tenant gets the same catalog. Left empty here so the tenant chart's own
  # default applies — set it to override, e.g. to add a client-only role or to
  # change allowIpSans/ttl. The tenant chart validates the entries (unique,
  # RFC 1123, at least one allowedDomainsTemplate), so a bad catalog fails the
  # render rather than reaching bao.
  pki:
    roles: []
  sso:
    enabled: false
    issuerUrl: ""
    # The IdP client for every OpenBao oidc mount: each tenant's, and the shared
    # space's when sharedSpace is on. With SSO on, clientId,
    # clientSecretRef.name, clientSecretRef.key and audience must be set.
    # clientSecretRef names a Secret in operatorNamespace. caBundlePem is the
    # PEM of the CA behind the IdP's TLS certificate; empty uses the system
    # roots. Every role binds `audience` to the token's aud claim, which Dex and
    # Keycloak set to the client ID, so change the two together. No value under
    # parent.sso may contain "{{".
    clientId: openbao
    clientSecretRef:
      name: bao-oidc-client-secret
      key: client-secret
    caBundlePem: ""
    audience: openbao
    # OIDC redirect URIs (tenant chart value sso.allowedRedirectUris). bao
    # rejects an oidc role with an empty list, so the tenant chart fails the
    # render when sso.enabled and this resolves empty. Left empty here means the
    # tenant chart's default (http://localhost:8250/oidc/callback, the bao CLI's
    # loopback listener) — set the real console callback for browser logins.
    # One web UI entry, https://<bao>/ui/vault/auth/oidc/oidc/callback, serves
    # every namespace, the shared space included (charts/README.md → Redirect URIs).
    allowedRedirectUris: []
    # Lets people log in to the shared space, where cross-tenant KV shares live,
    # and see their tenant's shares in the web UI. Off by default: when on, the
    # viewers, editors and admins of a receiving tenant can read what other
    # tenants sent it, not only the importing app (audit-read lists names).
    # Needs `enabled`, `issuerUrl` and the client values above, and
    # openbaoConfigMto.version 0.21.0 or later.
    sharedSpace:
      enabled: false

# Drift protection for everything the Templates render (t-op-v2 Template
# spec.sync), applied to both the parent and child Templates. Requires
# template-operator-v2 >= 0.0.5 (child TemplateInstances need
# namespaceSelector). Full semantics — delete behavior, upgrade notes,
# strict prerequisites — in the charts README → "Drift protection".
#   off    — apply once per re-render; out-of-band edits persist.
#   revert — watch every rendered resource and re-apply on drift.
#   strict — revert + admission webhook blocking third-party UPDATE/DELETE.
sync:
  mode: revert
  # Field paths exempt from drift enforcement (dot notation, [*] array
  # wildcard). strict needs at least metadata.finalizers.
  ignoreFields: []
