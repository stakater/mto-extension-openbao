apiVersion: v2
name: mto-extension-openbao-bootstrap
description: |
  Cluster-level bootstrap for the OpenBao config / MTO integration.
  Installs the t-op-v2 parent Template (one TemplateInstance per MTO
  Tenant CR), the child Template that pulls the mto-extension-openbao chart
  from OCI, the bao-token-reviewer Secret + auth-delegator binding, and
  the t-op-v2 RBAC needed to manage TemplateInstances + OpenBao* CRs +
  workload Deployments and ServiceAccounts.

  Requires: multi-tenant-operator (Tenant CRD), template-operator-v2
  >= 0.0.5 (child TemplateInstances need namespaceSelector; >= 0.0.6 for
  sync.mode=strict), and the OpenBao config operator installed.
type: application
version: 0.15.0
appVersion: "0.4.0"
