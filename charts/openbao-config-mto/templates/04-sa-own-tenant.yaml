{{/*
Section 4 (own-tenant) — per annotated ServiceAccount:
  - OpenBaoPolicy <tenant>-<saNs>-<sa>-<tier>     (KV + transit + PKI grants in tenant's bao ns)
  - OpenBaoKubernetesAuthRole same name            (bound to SA in its k8s ns)
  - ConfigMap bao-config-<sa>                       (VAULT_* env for SDK consumers)
  - SecretStore <sa>-bao                            (for ESO consumers; if eso=enabled)

Skips SAs that don't carry a `bao.stakater.com/tier` annotation. Every SA in
.Values.serviceAccounts is, by construction, in a k8s namespace owned by
.Values.tenant — the child TI's single objectFieldRef LIST is scoped via
namespaceSelector matchLabels: { <tenantLabelKey>: <tenant> }.

Per-SA opt-ins:
  bao.stakater.com/tier                  required: viewer | editor | admin | audit-read (or default via .Values.defaultCapability)
  bao.stakater.com/subscribe-to-ns       intra-tenant: CSV of writer namespaces
  bao.stakater.com/kv-export-tenant      cross-tenant share-out: CSV of peer tenants
  bao.stakater.com/kv-import-tenant    cross-tenant share-in: CSV of peer tenants
  bao.stakater.com/transit               transit: "true" to grant encrypt/decrypt on the SA's own-namespace key + the tenant shared key
  bao.stakater.com/pki                   pki: "true" to grant direct bao PKI access against the tenant's single role
                                          (apps using cert-manager Issuer injection don't need this — cert-manager
                                          authenticates via its own SA)
  bao.stakater.com/pki-allow-tenant      cross-tenant PKI: CSV of peer tenants to accept inbound (implies trust);
                                          consumed by 11-pki-cross-tenant-trust.yaml (needs pki.crossTenant.enabled)
  bao.stakater.com/pki-trust-tenant      cross-tenant PKI: CSV of peer tenants to trust outbound only (trust without
                                          accepting inbound); consumed by 11-pki-cross-tenant-trust.yaml
*/}}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $labels := include "openbao.labels" . }}
{{- /* Set of every k8s namespace this tenant owns, derived from the SA +
       Deployment lists the child TI resolves via its namespaceSelector.
       Used to reject `subscribe-to-ns` targets outside the tenant. */ -}}
{{- $tenantNamespaces := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $ns := dig "metadata" "namespace" "" $sa }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $ns := dig "metadata" "namespace" "" $d }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $rawTier := dig "metadata" "annotations" "bao.stakater.com/tier" "" $sa }}
{{- $saName := dig "metadata" "name" "" $sa }}
{{- $saNs := dig "metadata" "namespace" "" $sa }}
{{- $subscribeRaw := dig "metadata" "annotations" "bao.stakater.com/subscribe-to-ns" "" $sa }}
{{- $exposeRaw := dig "metadata" "annotations" "bao.stakater.com/kv-export-tenant" "" $sa }}
{{- $importRaw := dig "metadata" "annotations" "bao.stakater.com/kv-import-tenant" "" $sa }}
{{- $transitOptIn := dig "metadata" "annotations" "bao.stakater.com/transit" "" $sa }}
{{- $transitExposeRaw := dig "metadata" "annotations" "bao.stakater.com/transit-export-tenant" "" $sa }}
{{- $transitImportRaw := dig "metadata" "annotations" "bao.stakater.com/transit-import-tenant" "" $sa }}
{{- $pkiOptIn := dig "metadata" "annotations" "bao.stakater.com/pki" "" $sa }}
{{- $transitMount := $.Values.transit.mountPath }}
{{- $pkiMount := include "openbao.pkiMount" $ }}
{{- /* Fall back to defaultCapability when SA omits the tier annotation. */ -}}
{{- $tier := $rawTier }}
{{- if not $tier }}{{ $tier = $.Values.defaultCapability }}{{ end }}
{{- /* A tier outside tierCaps (typically a typo) makes the caps lookup nil and
       the SA is silently skipped — a workload denied access with no signal.
       Fail loudly instead, matching subscribe-to-ns. "none" opts the SA out
       and is always allowed. */ -}}
{{- if not (has $tier (append (keys $.Values.tierCaps) "none")) }}
{{- fail (printf "bao.stakater.com/tier %q on ServiceAccount %s/%s is not a known tier (valid: %s, or \"none\" to opt out)" $tier $saNs $saName (keys $.Values.tierCaps | sortAlpha | join ", ")) }}
{{- end }}
{{- $caps := index $.Values.tierCaps $tier }}
{{- $transitCaps := index $.Values.transit.tierCaps $tier }}
{{- /* Intra-tenant transit: an SA opting in (editor/admin tier) gets its
       own-namespace key <saNs>-<env> and the tenant shared key. */ -}}
{{- $transitOn := and $.Values.transit.enabled (eq (lower (toString $transitOptIn)) "true") $transitCaps (ne $transitCaps "[]") }}
{{- $ownKey := include "openbao.transitNsKeyName" (dict "ns" $saNs "env" $env) }}
{{- $sharedKey := include "openbao.transitSharedKeyName" (dict "tenant" $tenant "env" $env) }}
{{- if and $tier (ne $tier "none") $saName $saNs $caps }}
{{- $roleName := include "openbao.roleName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "tier" $tier) }}
{{- /* Intra-tenant sharing can only target a namespace the tenant owns. A
       subscribe-to-ns to an unknown namespace grants read on a `_shared/`
       sub-prefix nothing writes to — a silent dead grant. Fail the render. */ -}}
{{- range $subNs := splitList "," $subscribeRaw }}
{{- $subNs = trim $subNs }}
{{- if and $subNs (not (hasKey $tenantNamespaces $subNs)) }}
{{- fail (printf "bao.stakater.com/subscribe-to-ns on ServiceAccount %s/%s references namespace %q, which is not a namespace of tenant %q (tenant owns: %s)" $saNs $saName $subNs $tenant (keys $tenantNamespaces | sortAlpha | join ", ")) }}
{{- end }}
{{- end }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $roleName }}
  openbaoNamespace: {{ $tenant }}/
  policy: |
    # 1. SA's own k8s namespace.
    path "kv/data/{{ $env }}/{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
    # 2a. _shared/ READ — own k8s ns sub-prefix (all data-reading tiers).
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- if $subscribeRaw }}
    {{- range $subNs := splitList "," $subscribeRaw }}
    {{- $subNs = trim $subNs }}
    {{- if $subNs }}
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $subNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $subNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- end }}
    {{- end }}
    # 2b. _shared/ WRITE scoped to own k8s ns sub-prefix.
    {{- if or (eq $tier "editor") (eq $tier "admin") }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/_shared/from-{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/_shared/from-{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
    {{- if $transitOn }}
    # 3. Transit — encrypt/decrypt/rewrap on the SA's own-namespace key and
    # the tenant shared key. Bao uses POST on these endpoints (update).
    {{- range $key := (list $ownKey $sharedKey) }}
    path "{{ $transitMount }}/encrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/decrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/rewrap/{{ $key }}"   { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $transitMount }}/keys/{{ $key }}"        { capabilities = ["read", "list"] }
    path "{{ $transitMount }}/keys/{{ $key }}/rotate" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/plaintext/{{ $key }}" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/wrapped/{{ $key }}"   { capabilities = ["update"] }
    path "{{ $transitMount }}/sign/{{ $key }}"     { capabilities = ["update"] }
    path "{{ $transitMount }}/verify/{{ $key }}"   { capabilities = ["update"] }
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.pki.enabled (eq (lower (toString $pkiOptIn)) "true") }}
    # 4. PKI — issue + sign grants against EVERY tenant role (the workload
    # picks which role to use). Apps using cert-manager Issuer injection
    # don't reach here; this block is for workloads that talk to bao directly.
    {{- range $r := $.Values.pki.roles }}
    {{- $rn := include "openbao.pkiDefaultRoleName" (dict "tpl" $r.nameTemplate "tenant" $tenant) }}
    path "{{ $pkiMount }}/issue/{{ $rn }}" { capabilities = ["update"] }
    path "{{ $pkiMount }}/sign/{{ $rn }}"  { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $pkiMount }}/roles/{{ $rn }}" { capabilities = ["read", "list"] }
    {{- end }}
    {{- end }}
    # CA reads — every PKI-enabled SA gets read access to the CA bundle
    # so it can validate issued chains.
    path "{{ $pkiMount }}/ca/pem"     { capabilities = ["read"] }
    path "{{ $pkiMount }}/ca_chain"   { capabilities = ["read"] }
    path "{{ $pkiMount }}/cert/ca"    { capabilities = ["read"] }
    {{- end }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKubernetesAuthRole
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $roleName }}
  path: kubernetes
  openbaoNamespace: {{ $tenant }}/
  targetServiceAccounts:
    - {{ $saName }}
  targetNamespaces:
    targetNamespaces:
      - {{ $saNs }}
  policies:
    - {{ $roleName }}
  {{- if $.Values.token.ttl }}
  tokenTTL: {{ $.Values.token.ttl }}
  {{- end }}
  {{- if $.Values.token.maxTTL }}
  tokenMaxTTL: {{ $.Values.token.maxTTL }}
  {{- end }}
  {{- if $.Values.token.period }}
  tokenPeriod: {{ $.Values.token.period }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-config-{{ $saName }}
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
data:
  VAULT_ADDR: {{ $.Values.baoServer }}
  {{- if $.Values.baoCABundle }}
  VAULT_CACERT: /etc/bao/ca/ca.crt
  {{- end }}
  VAULT_NAMESPACE: {{ $tenant }}/
  VAULT_K8S_ROLE: {{ $roleName }}
  VAULT_KV_OWN_PATH: kv/data/{{ $env }}/{{ $saNs }}/
  VAULT_KV_OWN_META_PATH: kv/metadata/{{ $env }}/{{ $saNs }}/
  VAULT_KV_SHARED_OUT_PATH: kv/data/{{ $env }}/_shared/from-{{ $saNs }}/
  {{- if $subscribeRaw }}
  {{- range $subNs := splitList "," $subscribeRaw }}
  {{- $subNs = trim $subNs }}
  {{- if $subNs }}
  {{- $nsKey := upper (replace "-" "_" $subNs) }}
  VAULT_FROM_{{ $nsKey }}_PATH: kv/data/{{ $env }}/_shared/from-{{ $subNs }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $exposeRaw }}
  {{- range $peer := splitList "," $exposeRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.shareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_OUT_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $importRaw }}
  {{- range $peer := splitList "," $importRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.shareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_IN_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $peer }}/to-{{ $tenant }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $transitOn }}
  VAULT_TRANSIT_MOUNT: {{ $transitMount }}
  VAULT_TRANSIT_OWN_KEY: {{ $ownKey }}
  VAULT_TRANSIT_OWN_ENCRYPT: {{ $transitMount }}/encrypt/{{ $ownKey }}
  VAULT_TRANSIT_OWN_DECRYPT: {{ $transitMount }}/decrypt/{{ $ownKey }}
  VAULT_TRANSIT_SHARED_KEY: {{ $sharedKey }}
  VAULT_TRANSIT_SHARED_ENCRYPT: {{ $transitMount }}/encrypt/{{ $sharedKey }}
  VAULT_TRANSIT_SHARED_DECRYPT: {{ $transitMount }}/decrypt/{{ $sharedKey }}
  {{- end }}
  {{- if and $.Values.transit.enabled $transitExposeRaw }}
  {{- range $peer := splitList "," $transitExposeRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $tenant "reader" $peer "env" $env) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ENCRYPT: transit/encrypt/{{ $keyName }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.transit.enabled $transitImportRaw }}
  {{- range $peer := splitList "," $transitImportRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $peer "reader" $tenant "env" $env) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.pki.enabled (eq (lower (toString $pkiOptIn)) "true") }}
  {{- /* An SA opted into PKI but pki.roles is empty — `first` would deref nil
         and the render would die with an opaque error. Fail clearly instead. */ -}}
  {{- if not $.Values.pki.roles }}
  {{- fail (printf "ServiceAccount %s/%s opts into bao.stakater.com/pki but pki.roles is empty — define at least one role under pki.roles" $saNs $saName) }}
  {{- end }}
  {{- /* Convenience paths for the PRIMARY (first) role; the SA is granted
         issue/sign on every role, reachable at <mount>/issue/<role>. */ -}}
  {{- $primaryRole := include "openbao.pkiDefaultRoleName" (dict "tpl" (first $.Values.pki.roles).nameTemplate "tenant" $tenant) }}
  VAULT_PKI_MOUNT: {{ $pkiMount }}
  VAULT_PKI_CA_PATH: {{ $pkiMount }}/ca/pem
  VAULT_PKI_ROLE: {{ $primaryRole }}
  VAULT_PKI_ISSUE_PATH: {{ $pkiMount }}/issue/{{ $primaryRole }}
  VAULT_PKI_SIGN_PATH:  {{ $pkiMount }}/sign/{{ $primaryRole }}
  {{- end }}
{{- if $.Values.baoCABundle }}
---
{{- /* A CA bundle is a public certificate, so it ships as a ConfigMap — the
       same shape as kube-root-ca.crt and as the trust-manager Bundle target in
       11-pki-cross-tenant-trust.yaml. Keeping it out of a Secret is what lets
       the bootstrap ClusterRole omit Secret write access. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-ca-bundle
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
data:
  ca.crt: |
{{ $.Values.baoCABundle | indent 4 }}
{{- end }}
{{- if eq $.Values.eso "enabled" }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $saName }}-bao
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $.Values.baoServer }}
      {{- if $.Values.baoCABundle }}
      caBundle: {{ $.Values.baoCABundle | b64enc | quote }}
      {{- end }}
      path: kv
      version: v2
      namespace: {{ $tenant }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $roleName }}
          serviceAccountRef:
            name: {{ $saName }}
{{- end }}
{{- end }}
{{- end }}
