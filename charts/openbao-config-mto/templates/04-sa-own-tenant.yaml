{{/*
Section 4 (own-tenant) — per annotated ServiceAccount:
  - OpenBaoPolicy <tenant>-<saNs>-<sa>              (KV + transit + PKI grants in tenant's bao ns)
  - OpenBaoKubernetesAuthRole same name              (bound to SA in its k8s ns)
  - ConfigMap bao-config-<sa>                        (VAULT_* env for SDK consumers)
  - SecretStore <sa>-bao                             (for ESO consumers; if eso=enabled and kv is on)

A ServiceAccount carrying no `bao.stakater.com/` annotation renders nothing. One
carrying an annotation the chart cannot honour renders a single ConfigMap
`bao-config-<sa>.error` describing the problem, and nothing else — see
`openbao.saFacts`. Rendered names reserve dot-separated
suffixes (`.error`, `.deploy-error`, `.share-<peer>-bao`) and G16 keeps
OpenBao-enabled ServiceAccount names dot-free, so no two rendered ConfigMap or
SecretStore names can collide. Role and policy names are not covered by this. Every SA in .Values.serviceAccounts is, by construction, in a
k8s namespace owned by .Values.tenant: the child TI's single objectFieldRef LIST
is scoped via namespaceSelector matchLabels: { <tenantLabelKey>: <tenant> }.

Access is opt-in per engine, and a tier says how much:

  bao.stakater.com/kv                    "true" → the app's own KV prefix
  bao.stakater.com/transit               "true" → the app, namespace and tenant transit keys
  bao.stakater.com/pki                   "true" → direct bao PKI access against the tenant's roles
                                          (apps using cert-manager Issuer injection don't need this —
                                          cert-manager authenticates via its own SA)
  bao.stakater.com/tier                  required alongside any engine: viewer | editor | admin | audit-read
  bao.stakater.com/app                   optional: the app that owns the KV prefix and transit key,
                                          defaulting to the ServiceAccount name
  bao.stakater.com/kv-subscribe-ns       intra-tenant: CSV of writer namespaces
  bao.stakater.com/kv-export-tenant      cross-tenant share-out: CSV of peer tenants
  bao.stakater.com/kv-import-tenant      cross-tenant share-in: CSV of peer tenants
  bao.stakater.com/transit-export-tenant cross-tenant transit, writer side: CSV of peer tenants
  bao.stakater.com/transit-import-tenant cross-tenant transit, reader side: CSV of peer tenants
  bao.stakater.com/pki-allow-tenant      cross-tenant PKI: CSV of peer tenants to accept inbound (implies trust);
                                          consumed by 11-pki-cross-tenant-trust.yaml (needs pki.crossTenant.enabled)
  bao.stakater.com/pki-trust-tenant      cross-tenant PKI: CSV of peer tenants to trust outbound only (trust without
                                          accepting inbound); consumed by 11-pki-cross-tenant-trust.yaml
*/}}
{{- /* Two components share this file's per-SA loop and validations: core
       emits Policy/Role/ConfigMap/Secret, eso emits the SecretStore. */ -}}
{{- $renderCore := include "openbao.componentEnabled" (dict "component" "core" "ctx" .) }}
{{- $renderEso := include "openbao.componentEnabled" (dict "component" "eso" "ctx" .) }}
{{- if or $renderCore $renderEso }}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $labels := include "openbao.labels" . }}
{{- /* Set of every k8s namespace this tenant owns, derived from the SA +
       Deployment lists the child TI resolves via its namespaceSelector.
       Used to reject `kv-subscribe-ns` targets outside the tenant. */ -}}
{{- $tenantNamespaces := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $ns := dig "metadata" "namespace" "" $sa }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $ns := dig "metadata" "namespace" "" $d }}
{{- if $ns }}{{ $_ := set $tenantNamespaces $ns true }}{{ end }}
{{- end }}
{{- $appClaims := include "openbao.appClaims" . | fromYaml }}
{{- /* Own-app leaves requested via kv-secret.<name>, keyed <ns>/<sa>. The
       #<key> fragment names a key inside the leaf, not a path. Informational
       only — the authoritative grant set is saFacts. */ -}}
{{- $secretLeaves := dict }}
{{- range $d := (ternary .Values.deployments (list) (kindIs "slice" .Values.deployments)) }}
{{- $dNs := dig "metadata" "namespace" "" $d }}
{{- $dSa := dig "spec" "template" "spec" "serviceAccountName" "" $d }}
{{- if and $dNs $dSa }}
{{- range $key, $rawVal := (dig "metadata" "annotations" (dict) $d) }}
{{- if hasPrefix "bao.stakater.com/kv-secret." $key }}
{{- $k := printf "%s/%s" $dNs $dSa }}
{{- $leaf := first (splitList "#" (toString $rawVal)) }}
{{- /* Same shape rule 05 enforces: a hostile value must not forge sibling
       fields in the entry block or name a path outside the app prefix. */ -}}
{{- if and $leaf (regexMatch "^[A-Za-z0-9_-]([A-Za-z0-9._/-]*[A-Za-z0-9_-])?$" $leaf) (not (contains ".." $leaf)) (not (contains "//" $leaf)) }}
{{- $_ := set $secretLeaves $k (append (index $secretLeaves $k | default (list)) $leaf) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* $renderCore too: this file also renders the eso slice, and unqualified a
       PKI-only typo hard-failed the tenant's ESO SecretStores with it. §10 keeps
       its own call for the certManager slice. */ -}}
{{- if and $renderCore (include "openbao.on" (dict "ctx" . "path" "pki.enabled")) }}{{ include "openbao.pkiAssertRoleNamesUnique" . }}{{ end }}
{{- /* Index accumulators: healthy entries keyed by resolved app, error entries
       by ServiceAccount name (the resolved app may be the invalid part). */ -}}
{{- $idxHealthy := dict }}
{{- $idxErrs := dict }}
{{- $idxHasKv := dict }}
{{- $idxHasTransit := dict }}
{{- $caBundleDone := dict }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $f := include "openbao.saFacts" (dict "sa" $sa "ctx" $ "tenantNamespaces" $tenantNamespaces "appClaims" $appClaims) | fromYaml }}
{{- $saName := $f.name }}
{{- $saNs := $f.ns }}
{{- $app := $f.app }}
{{- $tier := $f.tier }}
{{- $caps := $f.caps }}
{{- $transitMount := $.Values.transit.mountPath }}
{{- $pkiMount := include "openbao.pkiMount" $ }}
{{- $subscribeRaw := dig "metadata" "annotations" "bao.stakater.com/kv-subscribe-ns" "" $sa }}
{{- $exposeRaw := dig "metadata" "annotations" "bao.stakater.com/kv-export-tenant" "" $sa }}
{{- $importRaw := dig "metadata" "annotations" "bao.stakater.com/kv-import-tenant" "" $sa }}
{{- $transitExposeRaw := dig "metadata" "annotations" "bao.stakater.com/transit-export-tenant" "" $sa }}
{{- $transitImportRaw := dig "metadata" "annotations" "bao.stakater.com/transit-import-tenant" "" $sa }}
{{- $appKey := include "openbao.transitAppKeyName" (dict "ns" $saNs "app" $app "env" $env) }}
{{- $nsKey := include "openbao.transitNsKeyName" (dict "ns" $saNs "env" $env) }}
{{- $sharedKey := include "openbao.transitSharedKeyName" (dict "tenant" $tenant "env" $env) }}
{{- if and $f.errors $saName $saNs }}
{{- $m := index $idxErrs $saNs | default (dict) }}
{{- $_ := set $m $saName (printf "error: OpenBao annotations rejected — see ConfigMap bao-config-%s.error in this namespace" $saName) }}
{{- $_ := set $idxErrs $saNs $m }}
{{- if $renderCore }}
---
{{ include "openbao.errorConfigMap" (dict "name" (printf "bao-config-%s.error" $saName) "ns" $saNs "labels" $labels "subject" (printf "ServiceAccount %s/%s" $saNs $saName) "errors" $f.errors) }}
{{- end }}
{{- else if and $saName $saNs (or $f.kvOn $f.transitOn $f.pkiOn) }}
{{- $roleName := include "openbao.roleName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName) }}
{{- $engines := list }}
{{- if $f.kvOn }}{{- $engines = append $engines "kv" }}{{- end }}
{{- if $f.transitOn }}{{- $engines = append $engines "transit" }}{{- end }}
{{- if $f.pkiOn }}{{- $engines = append $engines "pki" }}{{- end }}
{{- $entry := printf "serviceAccount: %q\ntier: %q\nengines: %s" $saName $tier (join ", " $engines) }}
{{- if $f.kvOn }}
{{- $entry = printf "%s\nkvPath: kv/data/%s/%s/%s/" $entry $env $saNs $app }}
{{- $leaves := index $secretLeaves (printf "%s/%s" $saNs $saName) }}
{{- if $leaves }}
{{- $entry = printf "%s\nrequestedSecrets: %q" $entry (join ", " (uniq (sortAlpha $leaves))) }}
{{- end }}
{{- end }}
{{- if $f.transitOn }}
{{- $entry = printf "%s\ntransitKey: %s" $entry $appKey }}
{{- end }}
{{- $m := index $idxHealthy $saNs | default (dict) }}
{{- $_ := set $m $app $entry }}
{{- $_ := set $idxHealthy $saNs $m }}
{{- if $f.kvOn }}{{- $_ := set $idxHasKv $saNs true }}{{- end }}
{{- if $f.transitOn }}{{- $_ := set $idxHasTransit $saNs true }}{{- end }}
{{- if $renderCore }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  deletionPolicy: {{ include "openbao.grantDeletionPolicy" $ }}
  name: {{ $roleName }}
  openbaoNamespace: {{ $tenant }}/
  policy: |
    {{- if $f.kvOn }}
    # 1. The app's own secrets, at kv/data/<env>/<ns>/<app>/. The app defaults to
    # the ServiceAccount name — the identity bao authenticated — and is unique
    # within the namespace either by Kubernetes' own guarantee or by the render
    # check behind `bao.stakater.com/app`. Scoping here rather than at the
    # namespace stops one workload reading or overwriting another's secrets just
    # by sharing a namespace with it.
    path "kv/data/{{ $env }}/{{ $saNs }}/{{ $app }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/{{ $saNs }}/{{ $app }}/*" { capabilities = {{ $caps }} }
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/{{ $saNs }}/{{ $app }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/{{ $saNs }}/{{ $app }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/{{ $saNs }}/{{ $app }}/*"  { capabilities = ["update"] }
    {{- end }}
    # 2a. _shared/ READ — own k8s ns sub-prefix (all data-reading tiers). This is
    # also how two apps in one namespace share deliberately: whatever is written
    # here is readable by every tiered app in the namespace, and by any sibling
    # namespace that subscribes to it.
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- /* Subscriptions are READ-ONLY on the producing namespace's prefix, on
           BOTH the data and the metadata path. The subscriber's own tier caps
           must not be used here: in KV v2 the metadata endpoint is not a
           read-only view of the secret, it is where the secret's lifecycle
           lives. `update` sets max_versions / delete_version_after /
           cas_required — enough to destroy the producer's version history or
           break its writes — and `delete` removes the secret and every version
           outright. Granting an admin-tier subscriber its full caps here let it
           permanently destroy secrets belonging to a namespace it merely reads
           from. Own-namespace prefixes above keep full caps; those are the
           subscriber's own data. */ -}}
    {{- if $subscribeRaw }}
    {{- $subCaps := ternary "[\"list\"]" "[\"read\", \"list\"]" (eq $tier "audit-read") }}
    {{- range $subNs := splitList "," $subscribeRaw }}
    {{- $subNs = trim $subNs }}
    {{- if $subNs }}
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $subNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $subNs }}/*" { capabilities = {{ $subCaps }} }
    {{- end }}
    {{- end }}
    {{- end }}
    # 2b. _shared/ WRITE scoped to own k8s ns sub-prefix.
    {{- if or (eq $tier "editor") (eq $tier "admin") }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/_shared/from-{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/_shared/from-{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
    {{- end }}
    {{- if $f.transitOn }}
    # 3. Transit — three keys, mirroring the KV layout: the app's own key
    # (private to it), the namespace key (shared with the apps beside it) and the
    # tenant shared key. Bao uses POST on these endpoints (update).
    {{- range $key := (list $appKey $nsKey $sharedKey) }}
    path "{{ $transitMount }}/encrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/decrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/rewrap/{{ $key }}"   { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $transitMount }}/keys/{{ $key }}"        { capabilities = ["read", "list"] }
    path "{{ $transitMount }}/keys/{{ $key }}/rotate" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/plaintext/{{ $key }}" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/wrapped/{{ $key }}"   { capabilities = ["update"] }
    path "{{ $transitMount }}/sign/{{ $key }}"     { capabilities = ["update"] }
    path "{{ $transitMount }}/verify/{{ $key }}"   { capabilities = ["update"] }
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if $f.pkiOn }}
    # 4. PKI — issue + sign grants against EVERY tenant role (the workload
    # picks which role to use). Apps using cert-manager Issuer injection
    # don't reach here; this block is for workloads that talk to bao directly.
    {{- range $r := $.Values.pki.roles }}
    {{- $rn := include "openbao.pkiDefaultRoleName" (dict "tpl" $r.nameTemplate "tenant" $tenant) }}
    path "{{ $pkiMount }}/issue/{{ $rn }}" { capabilities = ["update"] }
    path "{{ $pkiMount }}/sign/{{ $rn }}"  { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $pkiMount }}/roles/{{ $rn }}" { capabilities = ["read", "list"] }
    {{- end }}
    {{- end }}
    # CA reads — every PKI-enabled SA gets read access to the CA bundle
    # so it can validate issued chains.
    path "{{ $pkiMount }}/ca/pem"     { capabilities = ["read"] }
    path "{{ $pkiMount }}/ca_chain"   { capabilities = ["read"] }
    path "{{ $pkiMount }}/cert/ca"    { capabilities = ["read"] }
    {{- end }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKubernetesAuthRole
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  deletionPolicy: {{ include "openbao.grantDeletionPolicy" $ }}
  name: {{ $roleName }}
  path: kubernetes
  openbaoNamespace: {{ $tenant }}/
  targetServiceAccounts:
    - {{ $saName }}
  targetNamespaces:
    targetNamespaces:
      - {{ $saNs }}
  policies:
    - {{ $roleName }}
  {{- if $.Values.token.ttl }}
  tokenTTL: {{ $.Values.token.ttl }}
  {{- end }}
  {{- if $.Values.token.maxTTL }}
  tokenMaxTTL: {{ $.Values.token.maxTTL }}
  {{- end }}
  {{- if $.Values.token.period }}
  tokenPeriod: {{ $.Values.token.period }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-config-{{ $saName }}
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
    bao.stakater.com/app: {{ $app | quote }}
data:
  VAULT_ADDR: {{ $.Values.baoServer }}
  {{- if $.Values.baoCABundle }}
  VAULT_CACERT: /etc/bao/ca/ca.crt
  {{- end }}
  VAULT_NAMESPACE: {{ $tenant }}/
  VAULT_K8S_ROLE: {{ $roleName }}
  {{- if $f.kvOn }}
  {{- /* Named APP, not OWN: the prefix narrowed from a namespace to one app, so a
         consumer still reading the old name would assume a wider path than it is
         granted. Renaming makes that a startup failure instead. */}}
  VAULT_KV_APP: {{ $app | quote }}
  VAULT_KV_APP_PATH: kv/data/{{ $env }}/{{ $saNs }}/{{ $app }}/
  VAULT_KV_APP_META_PATH: kv/metadata/{{ $env }}/{{ $saNs }}/{{ $app }}/
  VAULT_KV_SHARED_OUT_PATH: kv/data/{{ $env }}/_shared/from-{{ $saNs }}/
  {{- if $subscribeRaw }}
  {{- range $subNs := splitList "," $subscribeRaw }}
  {{- $subNs = trim $subNs }}
  {{- if $subNs }}
  {{- $subKey := upper (replace "-" "_" $subNs) }}
  VAULT_FROM_{{ $subKey }}_PATH: kv/data/{{ $env }}/_shared/from-{{ $subNs }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $exposeRaw }}
  {{- range $peer := splitList "," $exposeRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.shareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_OUT_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $importRaw }}
  {{- range $peer := splitList "," $importRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.shareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_IN_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $peer }}/to-{{ $tenant }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $f.transitOn }}
  VAULT_TRANSIT_MOUNT: {{ $transitMount }}
  VAULT_TRANSIT_APP_KEY: {{ $appKey }}
  VAULT_TRANSIT_APP_ENCRYPT: {{ $transitMount }}/encrypt/{{ $appKey }}
  VAULT_TRANSIT_APP_DECRYPT: {{ $transitMount }}/decrypt/{{ $appKey }}
  VAULT_TRANSIT_NS_KEY: {{ $nsKey }}
  VAULT_TRANSIT_NS_ENCRYPT: {{ $transitMount }}/encrypt/{{ $nsKey }}
  VAULT_TRANSIT_NS_DECRYPT: {{ $transitMount }}/decrypt/{{ $nsKey }}
  VAULT_TRANSIT_SHARED_KEY: {{ $sharedKey }}
  VAULT_TRANSIT_SHARED_ENCRYPT: {{ $transitMount }}/encrypt/{{ $sharedKey }}
  VAULT_TRANSIT_SHARED_DECRYPT: {{ $transitMount }}/decrypt/{{ $sharedKey }}
  {{- if $transitExposeRaw }}
  {{- range $peer := splitList "," $transitExposeRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $tenant "reader" $peer "env" $env) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ENCRYPT: transit/encrypt/{{ $keyName }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $transitImportRaw }}
  {{- range $peer := splitList "," $transitImportRaw }}
  {{- $peer = trim $peer }}
  {{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $peer "reader" $tenant "env" $env) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $f.pkiOn }}
  {{- /* Convenience paths for the PRIMARY (first) role; the SA is granted
         issue/sign on every role, reachable at <mount>/issue/<role>. */ -}}
  {{- $primaryRole := include "openbao.pkiDefaultRoleName" (dict "tpl" (first $.Values.pki.roles).nameTemplate "tenant" $tenant) }}
  VAULT_PKI_MOUNT: {{ $pkiMount }}
  VAULT_PKI_CA_PATH: {{ $pkiMount }}/ca/pem
  VAULT_PKI_ROLE: {{ $primaryRole }}
  VAULT_PKI_ISSUE_PATH: {{ $pkiMount }}/issue/{{ $primaryRole }}
  VAULT_PKI_SIGN_PATH:  {{ $pkiMount }}/sign/{{ $primaryRole }}
  {{- end }}
{{- if and $.Values.baoCABundle (not (hasKey $caBundleDone $saNs)) }}
{{- $_ := set $caBundleDone $saNs true }}
---
{{- /* A CA bundle is a public certificate, so it ships as a ConfigMap — the
       same shape as kube-root-ca.crt and as the trust-manager Bundle target in
       11-pki-cross-tenant-trust.yaml. Keeping it out of a Secret is what lets
       the bootstrap ClusterRole omit Secret write access. One per namespace. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-ca-bundle
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
data:
  ca.crt: |
{{ $.Values.baoCABundle | indent 4 }}
{{- end }}
{{- end }}
{{- if and $renderEso (eq $.Values.eso "enabled") $f.kvOn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $saName }}-bao
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
    bao.stakater.com/app: {{ $app | quote }}
spec:
  provider:
    vault:
      server: {{ $.Values.baoServer }}
      {{- if $.Values.baoCABundle }}
      caBundle: {{ $.Values.baoCABundle | b64enc | quote }}
      {{- end }}
      path: kv
      version: v2
      namespace: {{ $tenant }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $roleName }}
          serviceAccountRef:
            name: {{ $saName }}
{{- end }}
{{- end }}
{{- end }}
{{- /* One per workload namespace with an annotated ServiceAccount: the
       app -> path directory a seeder reads instead of hopping Deployment ->
       serviceAccountName -> bao-config-<sa>. A signpost, never an input —
       editing it changes no access. */ -}}
{{- if $renderCore }}
{{- $idxNs := dict }}
{{- range $ns, $_x := $idxHealthy }}{{- $_ := set $idxNs $ns true }}{{- end }}
{{- range $ns, $_x := $idxErrs }}{{- $_ := set $idxNs $ns true }}{{- end }}
{{- range $ns, $_x := $idxNs }}
{{- $healthy := index $idxHealthy $ns | default (dict) }}
{{- $errsIdx := index $idxErrs $ns | default (dict) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-apps
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
data:
  _format: "v1"
  _usage: "One entry per app that uses OpenBao in this namespace. Paths are API data paths; in the OpenBao UI open the kv mount and browse <env>/<namespace>/<app>/. The bao-config-<serviceaccount> ConfigMap holds the full environment for one app."
  {{- if or (hasKey $idxHasKv $ns) (hasKey $idxHasTransit $ns) }}
  _namespace: |
    {{- if hasKey $idxHasKv $ns }}
    sharedOutPath: kv/data/{{ $env }}/_shared/from-{{ $ns }}/
    {{- end }}
    {{- if hasKey $idxHasTransit $ns }}
    transitNsKey: {{ include "openbao.transitNsKeyName" (dict "ns" $ns "env" $env) }}
    {{- end }}
  {{- end }}
  {{- range $appName, $entry := $healthy }}
  {{ $appName | quote }}: |
    {{- $entry | nindent 4 }}
  {{- end }}
  {{- /* Always .error-suffixed: app names cannot contain dots (G5), so these
         keys never collide with a healthy entry. */ -}}
  {{- range $errSa, $entry := $errsIdx }}
  {{ printf "%s.error" $errSa | quote }}: |
    {{- $entry | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
