{{/*
Section 4 (own-tenant) — per annotated ServiceAccount:
  - OpenBaoPolicy <tenant>-<saNs>-<sa>-<tier>     (KV + transit + PKI grants in tenant's bao ns)
  - OpenBaoKubernetesAuthRole same name            (bound to SA in its k8s ns)
  - ConfigMap bao-config-<sa>                       (VAULT_* env for SDK consumers)
  - SecretStore <sa>-bao                            (for ESO consumers; if eso=enabled)

Skips SAs that don't carry a `bao.stakater.com/tier` annotation. Every SA in
.Values.serviceAccounts is, by construction, in a k8s namespace owned by
.Values.tenant — the child TI's single objectFieldRef LIST is scoped via
namespaceSelector matchLabels: { <tenantLabelKey>: <tenant> }.

Per-SA opt-ins:
  bao.stakater.com/tier                  required: viewer | editor | admin | audit-read (or default via .Values.defaultCapability)
  bao.stakater.com/subscribe-to-ns       intra-tenant: CSV of writer namespaces
  bao.stakater.com/expose-to-tenant      cross-tenant share-out: CSV of peer tenants
  bao.stakater.com/import-from-tenant    cross-tenant share-in: CSV of peer tenants
  bao.stakater.com/transit-keys          transit: CSV of tenant-wide key names (validated against .Values.transit.keys)
  bao.stakater.com/pki-roles             pki: CSV of tenant-wide role names (validated against .Values.pki.roles)
*/}}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $labels := include "openbao.labels" . }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $rawTier := dig "metadata" "annotations" "bao.stakater.com/tier" "" $sa }}
{{- $saName := dig "metadata" "name" "" $sa }}
{{- $saNs := dig "metadata" "namespace" "" $sa }}
{{- $subscribeRaw := dig "metadata" "annotations" "bao.stakater.com/subscribe-to-ns" "" $sa }}
{{- $exposeRaw := dig "metadata" "annotations" "bao.stakater.com/expose-to-tenant" "" $sa }}
{{- $importRaw := dig "metadata" "annotations" "bao.stakater.com/import-from-tenant" "" $sa }}
{{- $transitRaw := dig "metadata" "annotations" "bao.stakater.com/transit-keys" "" $sa }}
{{- $transitExposeRaw := dig "metadata" "annotations" "bao.stakater.com/expose-transit-to-tenant" "" $sa }}
{{- $transitImportRaw := dig "metadata" "annotations" "bao.stakater.com/import-transit-from-tenant" "" $sa }}
{{- $pkiRolesRaw := dig "metadata" "annotations" "bao.stakater.com/pki-roles" "" $sa }}
{{- $transitMount := $.Values.transit.mountPath }}
{{- $pkiMount := $.Values.pki.mountPath }}
{{- /* Validate transit + pki CSV annotations against the chart catalog
       BEFORE we start rendering. Typo'd entries become helm-render errors
       with a clear message; honor strictAnnotationValidation flags. */ -}}
{{- include "openbao.validateCsvAgainstCatalog" (dict
    "csv" $transitRaw "catalog" $.Values.transit.keys
    "annotation" "bao.stakater.com/transit-keys"
    "saName" $saName "saNs" $saNs "strict" $.Values.transit.strictAnnotationValidation) }}
{{- include "openbao.validateCsvAgainstCatalog" (dict
    "csv" $pkiRolesRaw "catalog" $.Values.pki.roles
    "annotation" "bao.stakater.com/pki-roles"
    "saName" $saName "saNs" $saNs "strict" $.Values.pki.strictAnnotationValidation) }}
{{- /* Fall back to defaultCapability when SA omits the tier annotation. */ -}}
{{- $tier := $rawTier }}
{{- if not $tier }}{{ $tier = $.Values.defaultCapability }}{{ end }}
{{- $caps := index $.Values.tierCaps $tier }}
{{- $transitCaps := index $.Values.transit.tierCaps $tier }}
{{- if and $tier (ne $tier "none") $saName $saNs $caps }}
{{- $roleName := include "openbao.roleName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "tier" $tier) }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $roleName }}
  openbaoNamespace: {{ $tenant }}/
  policy: |
    # 1. SA's own k8s namespace.
    path "kv/data/{{ $env }}/{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
    # 2a. _shared/ READ — own k8s ns sub-prefix (all data-reading tiers).
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- if $subscribeRaw }}
    {{- range $subNs := splitList "," $subscribeRaw }}
    {{- $subNs = trim $subNs }}
    {{- if $subNs }}
    {{- if ne $tier "audit-read" }}
    path "kv/data/{{ $env }}/_shared/from-{{ $subNs }}/*"     { capabilities = ["read", "list"] }
    {{- end }}
    path "kv/metadata/{{ $env }}/_shared/from-{{ $subNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- end }}
    {{- end }}
    # 2b. _shared/ WRITE scoped to own k8s ns sub-prefix.
    {{- if or (eq $tier "editor") (eq $tier "admin") }}
    path "kv/data/{{ $env }}/_shared/from-{{ $saNs }}/*"     { capabilities = {{ $caps }} }
    path "kv/metadata/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = {{ $caps }} }
    {{- end }}
    {{- if eq $tier "admin" }}
    path "kv/delete/{{ $env }}/_shared/from-{{ $saNs }}/*"   { capabilities = ["update"] }
    path "kv/undelete/{{ $env }}/_shared/from-{{ $saNs }}/*" { capabilities = ["update"] }
    path "kv/destroy/{{ $env }}/_shared/from-{{ $saNs }}/*"  { capabilities = ["update"] }
    {{- end }}
    {{- if and $.Values.transit.enabled $transitRaw $transitCaps (ne $transitCaps "[]") }}
    # 3. Transit — per-key encrypt/decrypt grants. Bao uses POST on the
    # operation endpoints (encrypt/decrypt/rewrap/etc), so capability="update".
    {{- range $key := splitList "," $transitRaw }}
    {{- $key = trim $key }}
    {{- if $key }}
    path "{{ $transitMount }}/encrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/decrypt/{{ $key }}"  { capabilities = ["update"] }
    path "{{ $transitMount }}/rewrap/{{ $key }}"   { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $transitMount }}/keys/{{ $key }}"        { capabilities = ["read", "list"] }
    path "{{ $transitMount }}/keys/{{ $key }}/rotate" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/plaintext/{{ $key }}" { capabilities = ["update"] }
    path "{{ $transitMount }}/datakey/wrapped/{{ $key }}"   { capabilities = ["update"] }
    path "{{ $transitMount }}/sign/{{ $key }}"     { capabilities = ["update"] }
    path "{{ $transitMount }}/verify/{{ $key }}"   { capabilities = ["update"] }
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if and $.Values.pki.enabled $pkiRolesRaw }}
    # 4. PKI — per-role issuance grants. issue/<role> takes a CSR or
    # subject metadata via POST; sign/<role> takes a CSR. Both bao
    # capability="update".
    {{- range $role := splitList "," $pkiRolesRaw }}
    {{- $role = trim $role }}
    {{- if $role }}
    path "{{ $pkiMount }}/issue/{{ $role }}" { capabilities = ["update"] }
    path "{{ $pkiMount }}/sign/{{ $role }}"  { capabilities = ["update"] }
    {{- if eq $tier "admin" }}
    path "{{ $pkiMount }}/roles/{{ $role }}" { capabilities = ["read", "list"] }
    {{- end }}
    {{- end }}
    {{- end }}
    # CA reads — every PKI-enabled SA gets read access to the CA bundle
    # so it can validate issued chains.
    path "{{ $pkiMount }}/ca/pem"     { capabilities = ["read"] }
    path "{{ $pkiMount }}/ca_chain"   { capabilities = ["read"] }
    path "{{ $pkiMount }}/cert/ca"    { capabilities = ["read"] }
    {{- end }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKubernetesAuthRole
metadata:
  name: {{ $roleName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $roleName }}
  path: kubernetes
  openbaoNamespace: {{ $tenant }}/
  targetServiceAccounts:
    - {{ $saName }}
  targetNamespaces:
    targetNamespaces:
      - {{ $saNs }}
  policies:
    - {{ $roleName }}
  {{- if $.Values.token.ttl }}
  tokenTTL: {{ $.Values.token.ttl }}
  {{- end }}
  {{- if $.Values.token.maxTTL }}
  tokenMaxTTL: {{ $.Values.token.maxTTL }}
  {{- end }}
  {{- if $.Values.token.period }}
  tokenPeriod: {{ $.Values.token.period }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bao-config-{{ $saName }}
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
data:
  VAULT_ADDR: {{ $.Values.baoServer }}
  {{- if $.Values.baoCABundle }}
  VAULT_CACERT: /etc/bao/ca/ca.crt
  {{- end }}
  VAULT_NAMESPACE: {{ $tenant }}/
  VAULT_K8S_ROLE: {{ $roleName }}
  VAULT_KV_OWN_PATH: kv/data/{{ $env }}/{{ $saNs }}/
  VAULT_KV_OWN_META_PATH: kv/metadata/{{ $env }}/{{ $saNs }}/
  VAULT_KV_SHARED_OUT_PATH: kv/data/{{ $env }}/_shared/from-{{ $saNs }}/
  {{- if $subscribeRaw }}
  {{- range $subNs := splitList "," $subscribeRaw }}
  {{- $subNs = trim $subNs }}
  {{- if $subNs }}
  {{- $nsKey := upper (replace "-" "_" $subNs) }}
  VAULT_FROM_{{ $nsKey }}_PATH: kv/data/{{ $env }}/_shared/from-{{ $subNs }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $exposeRaw }}
  {{- range $peer := splitList "," $exposeRaw }}
  {{- $peer = trim $peer }}
  {{- if $peer }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.shareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_OUT_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $importRaw }}
  {{- range $peer := splitList "," $importRaw }}
  {{- $peer = trim $peer }}
  {{- if $peer }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  VAULT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.shareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_IN_{{ $peerKey }}_PATH: kv/data/{{ $env }}/from-{{ $peer }}/to-{{ $tenant }}/
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.transit.enabled $transitRaw }}
  VAULT_TRANSIT_MOUNT: {{ $transitMount }}
  {{- range $key := splitList "," $transitRaw }}
  {{- $key = trim $key }}
  {{- if $key }}
  {{- $keyEnv := upper (replace "-" "_" $key) }}
  VAULT_TRANSIT_KEY_{{ $keyEnv }}_ENCRYPT: {{ $transitMount }}/encrypt/{{ $key }}
  VAULT_TRANSIT_KEY_{{ $keyEnv }}_DECRYPT: {{ $transitMount }}/decrypt/{{ $key }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.transit.enabled $transitExposeRaw }}
  {{- range $peer := splitList "," $transitExposeRaw }}
  {{- $peer = trim $peer }}
  {{- if $peer }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $tenant "reader" $peer "env" $env) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_ENCRYPT: transit/encrypt/{{ $keyName }}
  VAULT_TRANSIT_OUT_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.transit.enabled $transitImportRaw }}
  {{- range $peer := splitList "," $transitImportRaw }}
  {{- $peer = trim $peer }}
  {{- if $peer }}
  {{- $peerKey := upper (replace "-" "_" $peer) }}
  {{- $keyName := include "openbao.transitShareKeyName" (dict "writer" $peer "reader" $tenant "env" $env) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_NAMESPACE: {{ $.Values.sharedTenant.name }}/
  VAULT_TRANSIT_IN_{{ $peerKey }}_ROLE: {{ include "openbao.transitShareInName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
  VAULT_TRANSIT_IN_{{ $peerKey }}_DECRYPT: transit/decrypt/{{ $keyName }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $.Values.pki.enabled $pkiRolesRaw }}
  VAULT_PKI_MOUNT: {{ $pkiMount }}
  VAULT_PKI_CA_PATH: {{ $pkiMount }}/ca/pem
  {{- range $role := splitList "," $pkiRolesRaw }}
  {{- $role = trim $role }}
  {{- if $role }}
  {{- $roleEnv := upper (replace "-" "_" $role) }}
  VAULT_PKI_ROLE_{{ $roleEnv }}_ISSUE: {{ $pkiMount }}/issue/{{ $role }}
  VAULT_PKI_ROLE_{{ $roleEnv }}_SIGN:  {{ $pkiMount }}/sign/{{ $role }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- if $.Values.baoCABundle }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bao-ca-bundle
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
{{ $.Values.baoCABundle | indent 4 }}
{{- end }}
{{- if eq $.Values.eso "enabled" }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $saName }}-bao
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $.Values.baoServer }}
      {{- if $.Values.baoCABundle }}
      caBundle: {{ $.Values.baoCABundle | b64enc | quote }}
      {{- end }}
      path: kv
      version: v2
      namespace: {{ $tenant }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $roleName }}
          serviceAccountRef:
            name: {{ $saName }}
{{- end }}
{{- end }}
{{- end }}
