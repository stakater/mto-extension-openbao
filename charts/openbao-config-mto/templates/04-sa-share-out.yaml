{{- if include "openbao.componentEnabled" (dict "component" "core" "ctx" .) }}
{{/*
Section 4a (share-out) — per `bao.stakater.com/kv-export-tenant: <peer-1>,<peer-2>`
annotation entry, emit a Policy + Role pair in <sharedTenant>/ that grants the SA
write access to kv/data/<env>/from-<own-tenant>/to-<peer>/*.
*/}}
{{- $tenant := required ".Values.tenant must be set by the parent" .Values.tenant }}
{{- $env := .Values.env }}
{{- $shared := .Values.sharedTenant.name }}
{{- $labels := include "openbao.labels" . }}
{{- $tenantNamespaces := include "openbao.tenantNamespaces" . | fromYaml }}
{{- $appClaims := include "openbao.appClaims" . | fromYaml }}
{{- range $sa := (ternary .Values.serviceAccounts (list) (kindIs "slice" .Values.serviceAccounts)) }}
{{- $f := include "openbao.saFacts" (dict "sa" $sa "ctx" $ "tenantNamespaces" $tenantNamespaces "appClaims" $appClaims) | fromYaml }}
{{- $saName := $f.name }}
{{- $saNs := $f.ns }}
{{- $exposeRaw := dig "metadata" "annotations" "bao.stakater.com/kv-export-tenant" "" $sa }}
{{- if and $f.kvOn (not $f.errors) $saName $saNs $exposeRaw }}
{{- range $peer := splitList "," $exposeRaw }}
{{- $peer = trim $peer }}
{{- if include "openbao.peerEmittable" (dict "peer" $peer "knownCsv" $.Values.knownTenants) }}
{{- $shareOutName := include "openbao.shareOutName" (dict "tenant" $tenant "saNs" $saNs "saName" $saName "peer" $peer) }}
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  name: {{ $shareOutName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $shareOutName }}
  openbaoNamespace: {{ $shared }}/
  policy: |
    path "kv/data/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/*"     { capabilities = ["create", "read", "update", "list"] }
    path "kv/metadata/{{ $env }}/from-{{ $tenant }}/to-{{ $peer }}/*" { capabilities = ["create", "read", "update", "list"] }
---
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoKubernetesAuthRole
metadata:
  name: {{ $shareOutName }}
  namespace: {{ $.Values.operatorNamespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  name: {{ $shareOutName }}
  path: kubernetes
  openbaoNamespace: {{ $shared }}/
  targetServiceAccounts:
    - {{ $saName }}
  targetNamespaces:
    targetNamespaces:
      - {{ $saNs }}
  policies:
    - {{ $shareOutName }}
  {{- if $.Values.token.ttl }}
  tokenTTL: {{ $.Values.token.ttl }}
  {{- end }}
  {{- if $.Values.token.maxTTL }}
  tokenMaxTTL: {{ $.Values.token.maxTTL }}
  {{- end }}
  {{- if $.Values.token.period }}
  tokenPeriod: {{ $.Values.token.period }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
