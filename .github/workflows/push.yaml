name: Push

on:
  push:
    branches:
      - main
    # '*.md', not '**.md': charts/README.md is a test input.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'examples/**'

jobs:
  push-charts:
    name: Push Charts
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Lint, version pin, render tests, CRD schema check
        run: make all
        # crd-validate pulls the operator CRDs from a private chart, so this step
        # needs the credential too — not just the release step below.
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      # check-tag-free in the Makefile refuses a version that is already
      # published — helm push itself would overwrite it.
      - name: Package and push charts
        run: make helm-release
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      # The shared operator_push.yaml this job replaced sent this.
      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.1
        with:
          payload: |
            {
              "text": "openbao chart repo: chart release failed on main. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
