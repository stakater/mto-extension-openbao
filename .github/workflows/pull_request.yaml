name: Pull Request

on:
  pull_request:
    branches:
      - main
      - release
    # 'hack/' is deliberately not ignored — it holds the chart render tests,
    # their golden fixtures and the two Go helpers the tests run.
    #
    # '*.md', not '**.md': anndrift and vardrift read charts/README.md, so a
    # README-only PR must still run them. '*' does not cross a '/'.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'examples/**'

jobs:
  chart-tests:
    name: Chart Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The render tests shell out to the two Go helpers. Without a toolchain
      # the script downgrades its apiserver check to a skip, silently.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Lint, version pin, render tests, CRD schema check
        run: make all
        # crd-validate pulls the operator CRDs from its published (private)
        # chart, so this needs a package-read credential; without it the pull
        # fails the job rather than skipping the schema check. Same token
        # push.yaml pushes with — deliberate, rather than a second credential to
        # manage. A fork PR gets no secrets and would fail here.
        env:
          GHCR_USERNAME: stakater-user
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
