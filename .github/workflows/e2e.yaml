name: E2E

# Not on every push. The suite builds a whole cluster — kind, cert-manager,
# trust-manager, External Secrets, OpenBao, template-operator-v2, the operator —
# and takes the better part of twenty minutes, where `make all` in
# pull_request.yaml takes a minute and catches most regressions. So it runs when
# a human asks for it: on approval, by adding the label, or by dispatch.
#
# It needs the SAME credential `make all` needs and nothing more: the operator's
# chart and image are private GHCR packages, and so is the template-operator-v2
# dev build the Makefile pins, so GHCR_TOKEN (read:packages) goes to the run.
# Everything else on the cluster is an anonymous pull. A fork PR
# gets no secrets and fails at the operator install — the same limitation
# pull_request.yaml already has at crd-validate.
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_dispatch:

# One run per PR at a time: two approvals, or a label plus a dispatch, would
# otherwise build two clusters for the same commit.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-label:
    name: Verify Label
    # The approval path checks WHO approved: an approval-triggered run executes
    # PR-authored code (Makefile, hack/e2e scripts, Go tests) via the merge ref,
    # with a package-read secret in the environment. The gate limits that to
    # OWNER/MEMBER/COLLABORATOR associations — not a guarantee of write access,
    # but it excludes drive-by accounts. The other two triggers carry their own
    # bars: applying the label needs triage on this repo, a dispatch needs write.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.review.state == 'approved' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) || github.event.label.name == 'ok-to-test/kubernetes' }}
    runs-on: ubuntu-latest
    # Stated rather than inherited: removing a label needs write, and a repo
    # whose default token is read-only would otherwise fail this step at the
    # gate instead of running the suite.
    permissions:
      pull-requests: write
    steps:
      # Removed so the next run needs a fresh request, rather than the label
      # sitting there and re-triggering on unrelated events. continue-on-error
      # because a fork PR's token is read-only regardless of the permissions
      # block, and a 403 here must not gate the suite. Pinned by SHA: this job
      # holds pull-requests: write, and a third-party tag can be moved.
      - name: Remove the test label
        if: ${{ github.event.label.name == 'ok-to-test/kubernetes' }}
        continue-on-error: true
        uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1
        with:
          labels: ok-to-test/kubernetes

  e2e:
    name: Kind E2E
    needs: verify-label
    runs-on: ubuntu-latest
    # The suite talks to a kind cluster on this runner and to GHCR. It needs no
    # repository permission beyond reading the code.
    permissions:
      contents: read
    steps:
      # For pull_request events the default ref is already the PR merge ref, but
      # for pull_request_review it is the DEFAULT BRANCH: an approval-triggered
      # run would build main, report green, and gate nothing. The expression
      # falls back to the default for workflow_dispatch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # kind runs on the runner itself; there is no pre-provisioned cluster. The
      # same command a developer runs locally, so a CI-only failure means the
      # environment differs, not the harness. No HELM override: the Makefile
      # picks the system helm or downloads its pinned one, the same way `make
      # all` does in the other workflows.
      - name: Build the cluster and run the suite
        run: make e2e-kind
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

      # make e2e-kind writes these on any failure in the chain — cluster build,
      # dependency install, or the suite. `warn` rather than `ignore`: a missing
      # directory means the diagnostics path itself broke, which deserves a
      # visible notice.
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}
          path: ./e2e-logs/
          retention-days: 7
          if-no-files-found: warn
