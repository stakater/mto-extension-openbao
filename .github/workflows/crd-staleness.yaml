name: CRD Staleness

# The drift originates in another repo: an operator-side field rename changes no
# file here, so no push and no pull_request fires. A schedule is the only trigger
# shape that can see it.
on:
  schedule:
    # Weekly: drift is a slow failure, and crd-validate catches a stale copy the
    # moment anyone touches a chart.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  crd-staleness:
    name: CRD Staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare hack/crds against the operator repo
        id: check
        run: make crd-staleness
        env:
          GH_TOKEN: ${{ secrets.STAKATER_AB_REPOS }}

      # A scheduled run has no PR to turn red.
      - name: Notify on drift
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "openbao chart repo: vendored CRDs have drifted from the operator repo. Run `make crds-vendor` and re-run the chart tests. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
