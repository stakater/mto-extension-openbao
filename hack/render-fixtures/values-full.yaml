# Render-test fixture: every feature toggle on, every per-SA / per-Deployment
# annotation path exercised. Used by hack/chart-render-tests.sh to compare
# component slices against the full render. Tenant team-a owns namespaces
# team-a-dev and team-a-tools; team-b is a known peer for every share flavor.
tenant: team-a
knownTenants: "team-a,team-b"

eso: enabled

baoCABundle: |
  -----BEGIN CERTIFICATE-----
  MIIBFIXTUREONLYNOTAREALCERTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  -----END CERTIFICATE-----

sso:
  enabled: true
  dex:
    issuerUrl: "https://dex.example.com"

networkPolicy:
  enabled: true

monitoring:
  enabled: true

pki:
  enabled: true
  certManager:
    enabled: true
  crossTenant:
    enabled: true

serviceAccounts:
  # Kitchen-sink SA: own-tenant grants + every share flavor + transit + pki.
  - metadata:
      name: app-a
      namespace: team-a-dev
      annotations:
        bao.stakater.com/tier: editor
        bao.stakater.com/subscribe-to-ns: team-a-tools
        bao.stakater.com/kv-export-tenant: team-b
        bao.stakater.com/kv-import-tenant: team-b
        bao.stakater.com/transit: "true"
        bao.stakater.com/transit-export-tenant: team-b
        bao.stakater.com/transit-import-tenant: team-b
        bao.stakater.com/pki: "true"
        bao.stakater.com/pki-allow-tenant: team-b
        bao.stakater.com/pki-trust-tenant: team-b
  # Second tier + second namespace (makes team-a-tools an owned namespace so
  # app-a's subscribe-to-ns target is valid).
  - metadata:
      name: app-b
      namespace: team-a-tools
      annotations:
        bao.stakater.com/tier: admin
  # Read-only tier.
  - metadata:
      name: app-c
      namespace: team-a-dev
      annotations:
        bao.stakater.com/tier: viewer
  # No tier annotation → skipped (defaultCapability: none).
  - metadata:
      name: plain-sa
      namespace: team-a-dev

deployments:
  # Exercises secret.<name> (with and without #key), subscribe.<name>, and
  # import.<name> ExternalSecret flavors.
  - metadata:
      name: web
      namespace: team-a-dev
      annotations:
        bao.stakater.com/secret.web-db: "db-creds#password"
        bao.stakater.com/secret.web-cfg: "app-config"
        bao.stakater.com/subscribe.tools-shared: "team-a-tools/shared-item"
        bao.stakater.com/import.partner-data: "team-b/exported-item"
    spec:
      template:
        spec:
          serviceAccountName: app-a
  # No annotations → no ExternalSecrets for this deployment.
  - metadata:
      name: worker
      namespace: team-a-tools
    spec:
      template:
        spec:
          serviceAccountName: app-b
