# Render-test fixture: every feature toggle on, every per-SA / per-Deployment
# annotation path exercised, all of it valid — misconfiguration cases live in
# values-guards.yaml. Used by hack/chart-render-tests.sh to compare
# component slices against the full render. Tenant team-a owns namespaces
# team-a-dev and team-a-tools; team-b is a known peer for every share flavor.
tenant: team-a
knownTenants: "team-a,team-b"

eso: enabled

baoCABundle: |
  -----BEGIN CERTIFICATE-----
  MIIBFIXTUREONLYNOTAREALCERTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
  -----END CERTIFICATE-----

sso:
  enabled: true
  dex:
    issuerUrl: "https://dex.example.com"
    # Renders spec.oidcDiscoveryCaPem — a field behind an opt-in is invisible to
    # crd-validate unless a fixture turns the opt-in on.
    caBundlePem: |
      -----BEGIN CERTIFICATE-----
      MIIBkTCB+wIJAJ3xVFyz0kQxMA0GCSqGSIb3DQEBCwUAMBExDzANBgNVBAMMBmRl
      eC1jYTAeFw0yNjAxMDEwMDAwMDBaFw0zNjAxMDEwMDAwMDBaMBExDzANBgNVBAMM
      BmRleC1jYTBcMA0GCSqGSIb3DQEBAQUAA0sAMEgCQQDLp7Ck9dQ0nQ0YtVQZ3vXt
      -----END CERTIFICATE-----

# Renders tokenPeriod on the share-out / share-in roles.
token:
  ttl: "1h"
  maxTTL: "4h"
  period: "30m"

networkPolicy:
  enabled: true

monitoring:
  enabled: true

pki:
  enabled: true
  certManager:
    enabled: true
  crossTenant:
    enabled: true
  # Chart default plus every field the chart plumbs but the default role leaves
  # unset — allowBareDomains/allowGlobDomains, and the hardening fields whose
  # bao default is the permissive one. Each is a pass-through the chart omits
  # when absent, so a field no fixture sets is a field crd-validate never sends
  # through the apiserver: a rename or a wrong type on the operator side would
  # not show up here at all.
  roles:
    - nameTemplate: "{tenant}-svc"
      allowedDomainsTemplate:
        - "{namespace}.svc.cluster.local"
      allowSubdomains: true
      allowBareDomains: true
      allowGlobDomains: true
      enforceHostnames: true
      allowIpSans: false
      allowAnyName: false
      requireCN: true
      noStore: false
      generateLease: false
      codeSigningFlag: false
      emailProtection: false
      keyUsage:
        - DigitalSignature
        - KeyEncipherment
      extKeyUsage:
        - ServerAuth
        - ClientAuth
      ttl: "168h"
      maxTtl: "720h"
      serverFlag: true
      clientFlag: true

serviceAccounts:
  # Kitchen-sink SA: own-tenant grants + every share flavor + transit + pki.
  - metadata:
      name: app-a
      namespace: team-a-dev
      annotations:
        bao.stakater.com/kv: "true"
        bao.stakater.com/tier: editor
        bao.stakater.com/app: payments
        bao.stakater.com/kv-subscribe-ns: team-a-tools
        bao.stakater.com/kv-export-tenant: team-b
        bao.stakater.com/kv-import-tenant: team-b
        bao.stakater.com/transit: "true"
        bao.stakater.com/transit-export-tenant: team-b
        bao.stakater.com/transit-import-tenant: team-b
        bao.stakater.com/pki: "true"
        bao.stakater.com/pki-allow-tenant: team-b
        bao.stakater.com/pki-trust-tenant: team-b
  # Second tier + second namespace (makes team-a-tools an owned namespace so
  # app-a's kv-subscribe-ns target is valid).
  - metadata:
      name: app-b
      namespace: team-a-tools
      annotations:
        bao.stakater.com/kv: "true"
        bao.stakater.com/transit: "true"
        bao.stakater.com/tier: admin
  # Read-only tier. No app annotation, so its app is its own name.
  - metadata:
      name: app-c
      namespace: team-a-dev
      annotations:
        bao.stakater.com/kv: "true"
        bao.stakater.com/tier: viewer
  # No bao annotation at all → nothing rendered, no error. Also stands in for
  # the plumbing accounts every namespace carries (builder, deployer, default).
  - metadata:
      name: plain-sa
      namespace: team-a-dev

deployments:
  # Exercises kv-secret.<name> (with and without #key), kv-subscribe.<name>,
  # and kv-import.<name> ExternalSecret flavors.
  - metadata:
      name: web
      namespace: team-a-dev
      annotations:
        bao.stakater.com/kv-secret.web-db: "db-creds#password"
        bao.stakater.com/kv-secret.web-cfg: "app-config"
        bao.stakater.com/kv-subscribe.tools-shared: "team-a-tools/shared-item"
        bao.stakater.com/kv-import.partner-data: "team-b/exported-item"
    spec:
      template:
        spec:
          serviceAccountName: app-a
  # No annotations → no ExternalSecrets for this deployment.
  - metadata:
      name: worker
      namespace: team-a-tools
    spec:
      template:
        spec:
          serviceAccountName: app-b
