    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: openbao-config-mto
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: openbao-config-mto-0.12.0
    stakater.com/tenant: team-a
  name: team-a-team-a-dev-app-a-editor
  namespace: openbao-config-operator-system
spec:
  name: team-a-team-a-dev-app-a-editor
  openbaoNamespace: team-a/
  policy: |
    # 1. SA's own k8s namespace.
    path "kv/data/dev/team-a-dev/*"     { capabilities = ["create", "read", "update", "list"] }
    path "kv/metadata/dev/team-a-dev/*" { capabilities = ["create", "read", "update", "list"] }
    # 2a. _shared/ READ — own k8s ns sub-prefix (all data-reading tiers).
    path "kv/data/dev/_shared/from-team-a-dev/*"     { capabilities = ["read", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-dev/*" { capabilities = ["create", "read", "update", "list"] }
    path "kv/data/dev/_shared/from-team-a-tools/*"     { capabilities = ["read", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-tools/*" { capabilities = ["read", "list"] }
    # 2b. _shared/ WRITE scoped to own k8s ns sub-prefix.
    path "kv/data/dev/_shared/from-team-a-dev/*"     { capabilities = ["create", "read", "update", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-dev/*" { capabilities = ["create", "read", "update", "list"] }
    # 3. Transit — encrypt/decrypt/rewrap on the SA's own-namespace key and
    # the tenant shared key. Bao uses POST on these endpoints (update).
    path "transit/encrypt/team-a-dev-dev"  { capabilities = ["update"] }
    path "transit/decrypt/team-a-dev-dev"  { capabilities = ["update"] }
    path "transit/rewrap/team-a-dev-dev"   { capabilities = ["update"] }
    path "transit/encrypt/team-a-shared-dev"  { capabilities = ["update"] }
    path "transit/decrypt/team-a-shared-dev"  { capabilities = ["update"] }
    path "transit/rewrap/team-a-shared-dev"   { capabilities = ["update"] }
    # 4. PKI — issue + sign grants against EVERY tenant role (the workload
    # picks which role to use). Apps using cert-manager Issuer injection
    # don't reach here; this block is for workloads that talk to bao directly.
    path "pki-int/issue/team-a-svc" { capabilities = ["update"] }
    path "pki-int/sign/team-a-svc"  { capabilities = ["update"] }
    # CA reads — every PKI-enabled SA gets read access to the CA bundle
    # so it can validate issued chains.
    path "pki-int/ca/pem"     { capabilities = ["read"] }
    path "pki-int/ca_chain"   { capabilities = ["read"] }
    path "pki-int/cert/ca"    { capabilities = ["read"] }
