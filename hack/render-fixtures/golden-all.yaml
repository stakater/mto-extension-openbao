# Source: mto-extension-openbao/templates/03-pki-scaffolding.yaml
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineConfig
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-openbao
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: mto-extension-openbao-0.22.0
    stakater.com/tenant: team-a
  # Name kept as <tenant>-pki-root across both modes so the bootstrap's
  # caSerialNumber output keeps tracking it; in hierarchy mode the bao type
  # is intermediate (the name is just the k8s object name).
  name: team-a-pki-root
  namespace: openbao-config-operator-system
spec:
  TTL: 87600h
  commonName: team-a Internal CA
  internalSign:
    name: pki-platform
    openbaoNamespace: platform/
  keyBits: 3072
  keyType: rsa
  openbaoNamespace: team-a/
  path: pki-int
  # X.509 name constraints, in both modes — see the $emitCA comment above.
  permittedDnsDomains:
    - team-a-dev.svc.cluster.local
    - team-a-tools.svc.cluster.local
  # Publish this tenant's CA cert to a ConfigMap so trust-manager Bundles can
  # source it for cross-tenant trust (see 11-pki-cross-tenant-trust.yaml).
  publishCABundleConfigMap: team-a-ca
  type: intermediate
---
# Source: mto-extension-openbao/templates/03-pki-scaffolding.yaml
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPKISecretEngineRole
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-openbao
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: mto-extension-openbao-0.22.0
    stakater.com/tenant: team-a
  name: pki-team-a-svc
  namespace: openbao-config-operator-system
spec:
  allowAnyName: false
  allowBareDomains: true
  allowGlobDomains: true
  allowIpSans: false
  allowSubdomains: true
  allowedDomains:
    - team-a-dev.svc.cluster.local
    - team-a-tools.svc.cluster.local
  clientFlag: true
  codeSigningFlag: false
  deletionPolicy: Delete
  emailProtection: false
  enforceHostnames: true
  extKeyUsage:
    - ServerAuth
    - ClientAuth
  generateLease: false
  keyUsage:
    - DigitalSignature
    - KeyEncipherment
  maxTtl: 720h
  name: team-a-svc
  noStore: false
  openbaoNamespace: team-a/
  path: pki-int
  requireCN: true
  serverFlag: true
  ttl: 168h
