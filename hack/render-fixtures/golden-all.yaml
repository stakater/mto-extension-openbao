        includeAllKeys: true
        name: team-b-ca
  target:
    configMap:
      key: trust-bundle.pem
    # Synced ONLY into this tenant's namespaces (never cluster-wide).
    namespaceSelector:
      matchLabels:
        stakater.com/tenant: team-a
