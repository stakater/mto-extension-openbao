# Source: openbao-config-mto/templates/07-sso-policies.yaml
apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: openbao-config-mto
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: openbao-config-mto-0.12.0
    stakater.com/tenant: team-a
  name: sso-team-a-admin
  namespace: openbao-config-operator-system
spec:
  name: sso-team-a-admin
  openbaoNamespace: team-a/
  policy: |
    # SSO tier admin for tenant team-a.
    # KV — audit-read gets metadata list only; everyone else gets data.
    path "kv/data/dev/*"     { capabilities = ["create", "read", "update", "delete", "list"] }
    path "kv/metadata/dev/*" { capabilities = ["create", "read", "update", "delete", "list"] }
    path "kv/delete/dev/*"   { capabilities = ["update"] }
    path "kv/undelete/dev/*" { capabilities = ["update"] }
    path "kv/destroy/dev/*"  { capabilities = ["update"] }
    # Transit — humans get tier-appropriate access to every tenant key.
    path "transit/*"            { capabilities = ["create", "read", "update", "list", "delete"] }
    # PKI — every SSO tier can read the CA bundle; editors + admins can
    # issue against any role; admins can manage roles. No tier gets the
    # CA root/config paths: regenerating the CA invalidates every
    # previously issued cert, so it goes through the CR, not a login.
    path "pki-int/ca/pem"           { capabilities = ["read"] }
    path "pki-int/ca_chain"         { capabilities = ["read"] }
    path "pki-int/cert/ca"          { capabilities = ["read"] }
    path "pki-int/certs"            { capabilities = ["list"] }
    path "pki-int/cert/+"           { capabilities = ["read"] }
    path "pki-int/issue/+"          { capabilities = ["update"] }
    path "pki-int/sign/+"           { capabilities = ["update"] }
    path "pki-int/roles"            { capabilities = ["list"] }
    path "pki-int/roles/+"          { capabilities = ["create", "read", "update", "list", "delete"] }
---
