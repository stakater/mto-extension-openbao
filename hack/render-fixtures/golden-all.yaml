# Source: openbao-config-mto/templates/09-monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: openbao-config-mto
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: openbao-config-mto-0.12.0
    stakater.com/tenant: team-a
  name: openbao-config-mto-team-a
  namespace: monitoring
spec:
  groups:
    - name: openbao-config-mto-team-a.reconcile
      rules:
        - alert: OpenBaoRenderedCRNotReady
          annotations:
            description: Operator reconcile is failing for this CR; check controller logs in openbao-config-operator-system.
            summary: OpenBao CR {{ $labels.kind }}/{{ $labels.name }} not Ready for tenant team-a
          expr: |
            sum by (kind, name, namespace) (
              kube_customresource_status_conditions{
                customresource_group="security.mto.stakater.com",
                condition="Ready",
                status="false",
                label_stakater_com_tenant="team-a"
              }
            ) > 0
          for: 10m
          labels:
            severity: warning
            tenant: team-a
        - alert: OpenBaoExternalSecretSyncFailed
          annotations:
            description: Bao auth failure or missing source path. Check the ExternalSecret events + bao audit log.
            summary: ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not syncing
          expr: |
            externalsecret_status_condition{
              status="False",
              type="Ready",
              label_stakater_com_tenant="team-a"
            } > 0
          for: 5m
          labels:
            severity: warning
            tenant: team-a
