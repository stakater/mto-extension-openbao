apiVersion: security.mto.stakater.com/v1alpha1
kind: OpenBaoPolicy
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-openbao
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: mto-extension-openbao-0.22.0
    stakater.com/tenant: team-a
  name: team-a-team-a-dev-app-a
  namespace: openbao-config-operator-system
spec:
  deletionPolicy: Delete
  name: team-a-team-a-dev-app-a
  openbaoNamespace: team-a/
  policy: |
    # 1. The app's own secrets, at kv/data/<env>/<ns>/<app>/. The app defaults to
    # the ServiceAccount name — the identity bao authenticated — and is unique
    # within the namespace either by Kubernetes' own guarantee or by the render
    # check behind `bao.stakater.com/app`. Scoping here rather than at the
    # namespace stops one workload reading or overwriting another's secrets just
    # by sharing a namespace with it.
    path "kv/data/dev/team-a-dev/payments/*"     { capabilities = ["create", "read", "update", "patch", "list"] }
    path "kv/metadata/dev/team-a-dev/payments/*" { capabilities = ["create", "read", "update", "patch", "list"] }
    # 2a. _shared/ READ — own k8s ns sub-prefix (all data-reading tiers). This is
    # also how two apps in one namespace share deliberately: whatever is written
    # here is readable by every tiered app in the namespace, and by any sibling
    # namespace that subscribes to it.
    path "kv/data/dev/_shared/from-team-a-dev/*"     { capabilities = ["read", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-dev/*" { capabilities = ["create", "read", "update", "patch", "list"] }
    path "kv/data/dev/_shared/from-team-a-tools/*"     { capabilities = ["read", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-tools/*" { capabilities = ["read", "list"] }
    # 2b. _shared/ WRITE scoped to own k8s ns sub-prefix.
    path "kv/data/dev/_shared/from-team-a-dev/*"     { capabilities = ["create", "read", "update", "patch", "list"] }
    path "kv/metadata/dev/_shared/from-team-a-dev/*" { capabilities = ["create", "read", "update", "patch", "list"] }
    # 3. Transit — three keys, mirroring the KV layout: the app's own key
    # (private to it), the namespace key (shared with the apps beside it) and the
    # tenant shared key. Bao uses POST on these endpoints (update).
    path "transit/encrypt/team-a-dev-payments-dev-3f5614"  { capabilities = ["update"] }
    path "transit/decrypt/team-a-dev-payments-dev-3f5614"  { capabilities = ["update"] }
    path "transit/rewrap/team-a-dev-payments-dev-3f5614"   { capabilities = ["update"] }
    path "transit/encrypt/team-a-dev-dev"  { capabilities = ["update"] }
    path "transit/decrypt/team-a-dev-dev"  { capabilities = ["update"] }
    path "transit/rewrap/team-a-dev-dev"   { capabilities = ["update"] }
    path "transit/encrypt/team-a-shared-dev"  { capabilities = ["update"] }
    path "transit/decrypt/team-a-shared-dev"  { capabilities = ["update"] }
    path "transit/rewrap/team-a-shared-dev"   { capabilities = ["update"] }
    # 4. PKI — issue + sign grants against EVERY tenant role (the workload
    # picks which role to use). Apps using cert-manager Issuer injection
    # don't reach here; this block is for workloads that talk to bao directly.
    path "pki-int/issue/team-a-svc" { capabilities = ["update"] }
    path "pki-int/sign/team-a-svc"  { capabilities = ["update"] }
    # CA reads — every PKI-enabled SA gets read access to the CA bundle
    # so it can validate issued chains.
    path "pki-int/ca/pem"     { capabilities = ["read"] }
    path "pki-int/ca_chain"   { capabilities = ["read"] }
    path "pki-int/cert/ca"    { capabilities = ["read"] }
