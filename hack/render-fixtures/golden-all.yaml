# Source: mto-extension-openbao/templates/08-networkpolicies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: openbao-config-mto
    app.kubernetes.io/managed-by: helm-via-template-operator-v2
    app.kubernetes.io/name: mto-extension-openbao
    app.kubernetes.io/version: 0.4.0
    helm.sh/chart: mto-extension-openbao-0.22.0
    stakater.com/tenant: team-a
  name: openbao-config-mto-default-deny
  namespace: team-a-dev
spec:
  egress:
    # DNS — every workload needs it.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # Same-namespace egress — workloads still talk to each other.
    - to:
        - podSelector: {}
    # Cluster apiserver — required for the workload SA's TokenReview
    # round-trip. CIDR-free path: rely on the kubernetes Service in
    # default ns.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
